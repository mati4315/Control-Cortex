<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Logos 3D | OBS</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
    #stage{position:absolute;inset:0;display:grid;place-items:center;perspective:1400px;perspective-origin:50% 50%;transform-style:preserve-3d;pointer-events:none}
    #coin{position:relative;width:min(82vw,900px);aspect-ratio:4/3;transform-style:preserve-3d;animation:spin 12s linear infinite}
    .face{position:absolute;inset:0;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
    .face canvas{width:100%;height:100%;object-fit:contain}
    #front{transform:translateZ(2px)}
    #back{transform:rotateY(180deg) translateZ(2px)}
    @keyframes spin{0%{transform:rotateY(0deg)}50%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
  </style>
</head>
<body>
  <main id="stage" aria-label="Logos de Rulo girando en 3D">
    <div id="coin">
      <div class="face" id="front"><canvas aria-label="Logo 1"></canvas></div>
      <div class="face" id="back"><canvas aria-label="Logo 2"></canvas></div>
    </div>
  </main>
  <script>
    (()=>{
      function loadLogo(canvas,url){
        const image=new Image();
        image.onload=()=>{
          const ratio=window.devicePixelRatio||1;
          canvas.width=image.naturalWidth*ratio;canvas.height=image.naturalHeight*ratio;
          const context=canvas.getContext('2d',{willReadFrequently:true});
          context.drawImage(image,0,0,canvas.width,canvas.height);
          const frame=context.getImageData(0,0,canvas.width,canvas.height),pixels=frame.data;
          // Los JPG tienen fondo negro: elimina solamente los píxeles casi negros y neutros,
          // conservando los tonos dorados oscuros del logo y las letras.
          for(let i=0;i<pixels.length;i+=4){
            const red=pixels[i],green=pixels[i+1],blue=pixels[i+2];
            const high=Math.max(red,green,blue),low=Math.min(red,green,blue);
            if(high<=34&&high-low<=Math.max(5,high*.2))pixels[i+3]=0;
          }
          context.putImageData(frame,0,0);
        };
        image.onerror=()=>console.error('[Logos OBS] No se pudo cargar:',url);
        image.src=url;
      }
      loadLogo(document.querySelector('#front canvas'),'/rulo-logo-assets/1.jpg');
      loadLogo(document.querySelector('#back canvas'),'/rulo-logo-assets/2.jpg');
    })();
  </script>
</body>
</html>
