<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rulo | Respuestas del bot</title>
  <style>
    :root {
      --accent: #9fd50b;
      --mood: var(--accent);
      --panel: rgba(18, 22, 29, .96);
      --text: #f5f7fa;
      --muted: #aeb7c3;
      --avatar-ink: #111;
      --max-width: 760px;
      --message-size: 1.35rem;
    }
    /* Tema claro: se activa con ?theme=light o con overlayTheme='light' en la config del dashboard. */
    html.theme-light {
      --panel: rgba(255, 255, 255, .94);
      --text: #161b22;
      --muted: #5a6675;
    }
    html.theme-light #reply {
      background: linear-gradient(145deg, #fff, var(--panel) 72%);
      box-shadow: 0 12px 26px rgba(0,0,0,.15), 0 0 16px rgba(0,0,0,.07), inset 0 1px 0 rgba(255,255,255,.9);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: transparent; }
    body {
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 18px;
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }
    #reply {
      position: relative;
      width: fit-content;
      max-width: min(720px, var(--max-width), 100%);
      display: grid;
      grid-template-columns: 58px 1fr;
      gap: 14px;
      align-items: center;
      padding: 14px 18px 15px 14px;
      border: 1px solid color-mix(in srgb, var(--mood) 72%, transparent);
      border-left: 4px solid var(--mood);
      border-radius: 24px 26px 23px 26px;
      background: linear-gradient(145deg, rgba(34, 40, 49, .98), var(--panel) 62%);
      box-shadow: 0 16px 36px rgba(0,0,0,.36), 0 0 20px color-mix(in srgb, var(--mood) 16%, transparent), inset 0 1px 0 rgba(255,255,255,.1);
      backdrop-filter: blur(8px);
      opacity: 0;
      transform: translateY(-12px) scale(.98);
      transition: opacity 220ms ease, transform 220ms ease, border-color 200ms ease;
      text-align: left;
    }
    /* Silueta redondeada de globo y pequeña punta de diálogo a la derecha. */
    #reply::before, #reply::after {
      content: "";
      position: absolute;
      right: -13px;
      bottom: 16px;
      width: 0;
      height: 0;
      border-top: 11px solid transparent;
      border-bottom: 3px solid transparent;
      border-left: 14px solid var(--mood);
      pointer-events: none;
    }
    #reply::before { filter: drop-shadow(0 2px 2px rgba(0,0,0,.16)); }
    #reply::after {
      right: -9px;
      bottom: 18px;
      border-top-width: 8px;
      border-bottom-width: 2px;
      border-left-width: 11px;
      border-left-color: var(--panel);
    }
    #reply[data-tail-position="right-upper"]::before { top: 8px; bottom: auto; border-top-width: 3px; border-bottom-width: 11px; }
    #reply[data-tail-position="right-upper"]::after { top: 10px; bottom: auto; border-top-width: 2px; border-bottom-width: 8px; }
    #reply[data-tail-position="right-middle"]::before,
    #reply[data-tail-position="right-middle"]::after { top: 50%; bottom: auto; transform: translateY(-50%); }
    #reply[data-tail-position="right-middle"]::before { border-top-width: 7px; border-bottom-width: 7px; }
    #reply[data-tail-position="right-middle"]::after { border-top-width: 5px; border-bottom-width: 5px; }
    #reply[data-tail-position="right-lower"]::before { top: auto; bottom: 0; border-top-width: 23px; border-bottom-width: 1px; border-left-width: 24px; }
    #reply[data-tail-position="right-lower"]::after { top: auto; bottom: 2px; border-top-width: 19px; border-bottom-width: 1px; border-left-width: 20px; }
    #reply[data-tail-position^="bottom-"]::before,
    #reply[data-tail-position^="bottom-"]::after {
      top: auto;
      right: auto;
      width: 0;
      height: 0;
      border-top-style: solid;
      border-bottom: 0;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
    }
    #reply[data-tail-position^="bottom-"]::before { bottom: -13px; border-top-width: 14px; border-top-color: var(--mood); }
    #reply[data-tail-position^="bottom-"]::after { bottom: -9px; border-top-width: 11px; border-top-color: var(--panel); }
    #reply[data-tail-position="bottom-left"]::before,
    #reply[data-tail-position="bottom-left"]::after { left: 34px; }
    #reply[data-tail-position="bottom-center"]::before,
    #reply[data-tail-position="bottom-center"]::after { left: 50%; transform: translateX(-50%); }
    #reply[data-tail-position="bottom-right"]::before,
    #reply[data-tail-position="bottom-right"]::after { left: auto; right: 34px; }
    #reply.visible { opacity: 1; transform: translateY(0) scale(1); }
    #reply.leaving { opacity: 0; transform: translateY(-8px) scale(.98); }
    #reply[data-animation="pop"] { transform: scale(.82); }
    #reply[data-animation="pop"].visible { transform: scale(1); }
    #reply[data-animation="soft"] { transform: translateY(-4px); }
    #reply[data-animation="soft"].visible { transform: translateY(0); }
    #reply[data-show-avatar="false"] { grid-template-columns: 1fr; }
    /* Estados (mood) que emite el backend en rulo_bot_message. */
    #reply[data-mood="idle"]     { --mood: var(--accent); }
    #reply[data-mood="thinking"] { --mood: #6ea8fe; }
    #reply[data-mood="success"]  { --mood: var(--accent); }
    #reply[data-mood="warning"]  { --mood: #f5b13d; }
    #reply[data-mood="error"]    { --mood: #ef5f5f; }
    #reply[data-mood="speaking"] { --mood: var(--accent); }
    .avatar {
      width: 58px; height: 58px;
      display: grid; place-items: center;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.24);
      color: var(--avatar-ink);
      background: var(--mood);
      font-size: 1.55rem;
      font-weight: 800;
      overflow: hidden;
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--mood) 18%, transparent), 0 5px 14px rgba(0,0,0,.2);
      transition: background 200ms ease;
    }
    .avatar[hidden], #botName[hidden] { display: none !important; }
    .avatar img.mascot { width: 92%; height: 92%; object-fit: contain; display: block; }
    #reply[data-mood="thinking"] .avatar { animation: rulo-pulse 1.4s ease-in-out infinite; }
    #reply[data-mood="speaking"] .avatar { animation: rulo-talk .7s ease-in-out infinite; }
    #reply[data-mood="error"] .avatar { animation: rulo-shake .5s ease-in-out 2; }
    @keyframes rulo-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(.92); } }
    @keyframes rulo-talk { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes rulo-shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
    @media (prefers-reduced-motion: reduce) {
      .avatar, #reply { animation: none !important; transition: none !important; }
    }
    .reply-content { min-width: 0; }
    .bot { margin: 0 0 6px; color: var(--mood); font-size: .72rem; font-weight: 850; letter-spacing: .11em; text-transform: uppercase; text-align: left; }
    .message { max-height: 5.12em; margin: 0; overflow-x: hidden; overflow-y: auto; scrollbar-width: none; font-size: clamp(1rem, 2.2vw, var(--message-size)); line-height: 1.28; font-weight: 650; letter-spacing: .005em; overflow-wrap: anywhere; text-align: left; text-shadow: 0 1px 1px rgba(0,0,0,.18); }
    .message::-webkit-scrollbar { display: none; }
    .interpretation-badge { display: inline-block; margin-inline-start: .42em; font-size: .88em; font-weight: 800; vertical-align: .02em; white-space: nowrap; }
    .interpretation-badge[data-source="ai"] { color: #d9bdff; }
    .interpretation-badge[data-source="rules"] { color: #9dc7ff; }
    .interpretation-badge[data-source="rules-fallback"] { color: #ffc66d; }
    html.theme-light .interpretation-badge[data-source="ai"] { color: #7040b8; }
    html.theme-light .interpretation-badge[data-source="rules"] { color: #155a9b; }
    html.theme-light .interpretation-badge[data-source="rules-fallback"] { color: #8a5200; }
    .interpretation-badge[hidden] { display: none; }
    .reply-to { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; margin-top: 10px; padding: 5px 9px; overflow: hidden; border: 1px solid color-mix(in srgb, var(--mood) 28%, transparent); border-radius: 999px; color: var(--muted); background: color-mix(in srgb, var(--mood) 9%, transparent); font-size: .7rem; font-weight: 650; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
    .reply-to::before { content: "↳"; flex: 0 0 auto; color: var(--mood); font-size: 1rem; font-weight: 900; line-height: 1; }
    .reply-to:empty { display: none; }
    @media (max-width: 420px) {
      body { padding: 10px; }
      #reply { grid-template-columns: 44px 1fr; gap: 10px; padding: 11px; }
      .avatar { width: 44px; height: 44px; font-size: 1.15rem; }
    }
  </style>
</head>
<body>
  <section id="reply" aria-live="polite" aria-atomic="true" data-mood="idle">
    <div class="avatar"><span class="avatar-letter" id="avatarLetter">A</span><img class="mascot" id="mascot" alt="" hidden></div>
    <div class="reply-content">
      <p class="bot" id="botName">Rulo</p>
      <p class="message" id="message"><span id="messageText"></span><span id="interpretationBadge" class="interpretation-badge" hidden></span></p>
      <div class="reply-to" id="time"></div>
    </div>
  </section>
  <script>
    (function () {
      const panel = document.getElementById('reply');
      const botName = document.getElementById('botName');
      const message = document.getElementById('message');
      const messageText = document.getElementById('messageText');
      const interpretationBadge = document.getElementById('interpretationBadge');
      const time = document.getElementById('time');
      const avatarLetter = document.getElementById('avatarLetter');
      const mascot = document.getElementById('mascot');
      const avatar = mascot.parentElement;
      const params = new URLSearchParams(location.search);
      const isPreview = params.get('preview') === '1';
      const MASCOT_BASE = '/rulo-assets/';
      const failedMascots = new Set();
      let hideTimer = null;
      let messageScrollTimer = null;
      let messageScrollFrame = null;
      let messageScrollCycleMs = 0;
      let socket = null;
      let retry = 500;
      const waitingReplies = new Map();
      const startedReplies = new Map();
      const delayedReplies = new Set();
      const replyFallbacks = new Map();
      // El nombre visible lo manda la configuracion de Rulo (fuente unica de verdad).
      let config = { botName: 'Rulo', accent: '#9fd50b', avatarLetter: 'A', visibleMs: 12000, longReplyScrollDelayMs: 5000, replyDelayMs: 0, maxWidth: 760, fontSize: 1.35, panelOpacity: .94, showRequester: true, showMascot: false, showBotName: true, showAvatar: true, overlayTheme: 'dark', animation: 'slide', tailPosition: 'right-lower' };

      // Contraste del avatar: con un acento oscuro la inicial va clara, y al reves.
      function inkFor(hex) {
        const value = String(hex || '').replace('#', '');
        if (!/^[0-9a-f]{6}$/i.test(value)) return '#111';
        const r = parseInt(value.slice(0, 2), 16) / 255;
        const g = parseInt(value.slice(2, 4), 16) / 255;
        const b = parseInt(value.slice(4, 6), 16) / 255;
        return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 0.45 ? '#111' : '#f5f7fa';
      }

      function applyTheme(theme) {
        const light = String(theme || 'dark').toLowerCase() === 'light';
        document.documentElement.classList.toggle('theme-light', light);
        return light;
      }

      function applyConfig(next) {
        if (!next) return;
        config = Object.assign(config, next);
        const light = applyTheme(params.get('theme') || config.overlayTheme);
        document.documentElement.style.setProperty('--accent', config.accent);
        document.documentElement.style.setProperty('--avatar-ink', inkFor(config.accent));
        document.documentElement.style.setProperty('--max-width', config.maxWidth + 'px');
        document.documentElement.style.setProperty('--message-size', config.fontSize + 'rem');
        document.documentElement.style.setProperty('--panel', 'rgba(' + (light ? '255, 255, 255' : '14, 17, 22') + ', ' + config.panelOpacity + ')');
        panel.dataset.animation = config.animation || 'slide';
        const tailPosition = params.get('tailPosition') || config.tailPosition || 'right-lower';
        panel.dataset.tailPosition = ['right-upper','right-middle','right-lower','bottom-left','bottom-center','bottom-right'].includes(tailPosition) ? tailPosition : 'right-lower';
        panel.dataset.showAvatar = config.showAvatar === false ? 'false' : 'true';
        avatar.hidden = config.showAvatar === false;
        botName.hidden = config.showBotName === false;
        avatarLetter.textContent = config.avatarLetter || 'A';
        botName.textContent = config.botName || 'Rulo';
        applyMascot(config.showMascot === true, panel.dataset.mood || 'idle');
        if (config.mascotEnabled === false) clearPanel();
        if (!isPreview && panel.classList.contains('visible')) {
          messageScrollCycleMs = startMessageScroll();
          scheduleHide();
        }
      }

      function clearPanel() {
        clearTimeout(hideTimer);
        stopMessageScroll();
        messageScrollCycleMs = 0;
        delayedReplies.forEach(timer => clearTimeout(timer));
        replyFallbacks.forEach(timer => clearTimeout(timer));
        delayedReplies.clear(); replyFallbacks.clear(); waitingReplies.clear(); startedReplies.clear();
        panel.classList.remove('visible');
        panel.classList.add('leaving');
      }

      function stopMessageScroll() {
        if (messageScrollTimer) clearTimeout(messageScrollTimer);
        if (messageScrollFrame) cancelAnimationFrame(messageScrollFrame);
        messageScrollTimer = null;
        messageScrollFrame = null;
        message.scrollTop = 0;
      }

      function startMessageScroll() {
        stopMessageScroll();
        const initialMax = Math.max(0, message.scrollHeight - message.clientHeight);
        if (initialMax <= 2) return 0;

        const configuredHoldMs = Number(config.longReplyScrollDelayMs);
        const holdAtTopMs = Number.isFinite(configuredHoldMs) ? Math.min(30000, Math.max(0, configuredHoldMs)) : 5000;
        const holdAtBottomMs = 2000;
        const pixelsPerSecond = 18;
        const scrollDurationMs = Math.max(1800, (initialMax / pixelsPerSecond) * 1000);
        messageScrollTimer = setTimeout(function () {
          messageScrollTimer = null;
          let startAt = null;
          let lastMeasureAt = 0;
          let maxScroll = initialMax;
          function step(timestamp) {
            if (!panel.classList.contains('visible')) { messageScrollFrame = null; return; }
            if (startAt === null) startAt = timestamp;
            if (timestamp - lastMeasureAt >= 200) {
              maxScroll = Math.max(0, message.scrollHeight - message.clientHeight);
              lastMeasureAt = timestamp;
            }
            const progress = Math.min(1, (timestamp - startAt) / scrollDurationMs);
            message.scrollTop = maxScroll * progress;
            if (progress < 1) messageScrollFrame = requestAnimationFrame(step);
            else {
              message.scrollTop = Math.max(0, message.scrollHeight - message.clientHeight);
              messageScrollFrame = null;
            }
          }
          messageScrollFrame = requestAnimationFrame(step);
        }, holdAtTopMs);
        return holdAtTopMs + scrollDurationMs + holdAtBottomMs;
      }

      function scheduleHide() {
        clearTimeout(hideTimer);
        const baseVisibleMs = Math.max(2000, Number(config.visibleMs) || 12000);
        // El valor de config es la base. Si el texto desborda, suma al menos
        // 2.5 s y lo necesario para completar el desplazamiento lento y la pausa.
        const extraVisibleMs = messageScrollCycleMs
          ? Math.max(2500, messageScrollCycleMs - baseVisibleMs)
          : 0;
        const visibleMs = baseVisibleMs + extraVisibleMs;
        hideTimer = setTimeout(function () {
          panel.classList.remove('visible');
          panel.classList.add('leaving');
          stopMessageScroll();
        }, visibleMs);
      }

      function applyMascot(enabled, mood) {
        if (!enabled) {
          mascot.hidden = true;
          mascot.removeAttribute('src');
          avatarLetter.hidden = false;
          return;
        }
        const state = String(mood || 'idle').toLowerCase();
        const source = MASCOT_BASE + state + '.svg';
        if (failedMascots.has(source)) return;
        mascot.onload = function () { mascot.hidden = false; avatarLetter.hidden = true; };
        mascot.onerror = function () {
          failedMascots.add(source);
          mascot.hidden = true;
          avatarLetter.hidden = false;
          // Sin asset todavia: se conserva la inicial como respaldo.
          console.debug('[Rulo] Falta el asset de mascota para el estado', state);
        };
        mascot.src = source;
      }

      function show(data) {
        if (!data || !data.message) return;
        if (!isPreview && config.mascotEnabled === false) return;
        const mood = String(data.mood || 'success').toLowerCase();
        panel.dataset.mood = mood;
        botName.textContent = config.botName || 'Rulo';
        messageText.textContent = data.message;
        const badges = {
          ai: { icon: '✨', label: 'Interpretado con IA' },
          rules: { icon: '⚙', label: 'Interpretado con reglas locales' },
          'rules-fallback': { icon: '↘', label: 'La IA no pudo resolverlo; se usaron las reglas locales' }
        };
        const badge = badges[data.interpretationSource];
        interpretationBadge.hidden = !badge;
        interpretationBadge.textContent = badge ? badge.icon : '';
        interpretationBadge.title = badge ? badge.label : '';
        interpretationBadge.setAttribute('aria-label', badge ? badge.label : '');
        if (badge) interpretationBadge.dataset.source = data.interpretationSource;
        else delete interpretationBadge.dataset.source;
        time.textContent = config.showRequester && data.requester ? 'En respuesta a: ' + data.requester : '';
        applyMascot(config.showMascot === true, mood);
        panel.classList.remove('leaving');
        panel.classList.add('visible');
        messageScrollCycleMs = startMessageScroll();
        if (isPreview) return;
        scheduleHide();
      }

      function queueReply(data, forceOverlay = false) {
        if (!data || !data.message || data.provisional) return;
        if (forceOverlay) {
          delayedReplies.forEach(timer => clearTimeout(timer));
          replyFallbacks.forEach(timer => clearTimeout(timer));
          delayedReplies.clear();
          replyFallbacks.clear();
          waitingReplies.clear();
          startedReplies.clear();
          show(data);
          return;
        }
        const triggerId = String(data.triggerId || '');
        if (!triggerId) { show(data); return; }
        if (startedReplies.has(triggerId)) {
          const startedAt = startedReplies.get(triggerId);
          startedReplies.delete(triggerId);
          showAfterReplyDelay(data, startedAt);
          return;
        }
        waitingReplies.set(triggerId, data);
        while (waitingReplies.size > 30) {
          const oldest = waitingReplies.keys().next().value;
          waitingReplies.delete(oldest);
          clearTimeout(replyFallbacks.get(oldest));
          replyFallbacks.delete(oldest);
        }
        clearTimeout(replyFallbacks.get(triggerId));
        const fallback = setTimeout(function () {
          if (waitingReplies.get(triggerId) !== data) return;
          waitingReplies.delete(triggerId);
          replyFallbacks.delete(triggerId);
          showAfterReplyDelay(data, Date.now());
        }, 1500);
        replyFallbacks.set(triggerId, fallback);
      }

      function revealStartedReply(triggerId) {
        const id = String(triggerId || '');
        if (!id) return;
        clearTimeout(replyFallbacks.get(id));
        replyFallbacks.delete(id);
        const reply = waitingReplies.get(id);
        if (reply) {
          waitingReplies.delete(id);
          showAfterReplyDelay(reply, Date.now());
          return;
        }
        startedReplies.set(id, Date.now());
        while (startedReplies.size > 30) startedReplies.delete(startedReplies.keys().next().value);
      }

      function showAfterReplyDelay(data, startedAt) {
        const delayMs = Math.max(0, Number(config.replyDelayMs) || 0);
        const remainingMs = Math.max(0, delayMs - (Date.now() - startedAt));
        if (remainingMs === 0) show(data);
        else {
          const timer = setTimeout(() => { delayedReplies.delete(timer); show(data); }, remainingMs);
          delayedReplies.add(timer);
        }
      }

      function connect() {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socketUrl = new URL(protocol + '//' + location.host);
        socketUrl.searchParams.set('client', isPreview ? 'rulo-bot-preview' : 'rulo-bot-overlay');
        socket = new WebSocket(socketUrl.toString());
        socket.onopen = function () { retry = 500; };
        socket.onmessage = function (event) {
          try {
            const data = JSON.parse(event.data);
            if (data && data.type === 'rulo_bot_message') {
              const timestamp = Number(data.rulo && data.rulo.timestamp) || 0;
              if (!data.forceOverlay && timestamp && Date.now() - timestamp > 120000) return;
              queueReply(data.rulo, data.forceOverlay === true);
            }
            if (data && data.type === 'rulo_animation_started' && data.animation === 'hablando') revealStartedReply(data.triggerId);
            if (data && data.type === 'rulo_config_updated') applyConfig(data.config);
          } catch (_) {}
        };
        socket.onerror = function () { socket.close(); };
        socket.onclose = function () {
          setTimeout(connect, retry);
          retry = Math.min(5000, retry * 2);
        };
      }

      fetch('/api/rulo-config').then(function (response) { return response.json(); }).then(function (data) {
        applyConfig(data.config);
        if (isPreview) {
          show({
            message: params.get('message') || 'Vista previa del overlay de Rulo.',
            mood: params.get('mood') || 'idle',
            requester: params.get('requester') || 'Vista previa'
          });
        }
      }).catch(function () {});
      connect();
    }());
  </script>
</body>
</html>
