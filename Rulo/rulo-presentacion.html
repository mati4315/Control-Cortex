<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rulo | Presentación OBS</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}#stage{position:absolute;inset:0;pointer-events:none}video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;opacity:0}video.visible{opacity:1}
  </style>
</head>
<body>
  <div id="stage"><video muted playsinline preload="auto"></video><video muted playsinline preload="auto"></video></div>
  <script>
  (() => {
    const videos=[...document.querySelectorAll('video')];
    const files={entrada:'/rulo-animaciones/Presentacion%20-%20Entrada.mp4',espera:'/rulo-animaciones/Presentacion%20-%20Espera.mp4',despedida:'/rulo-animaciones/Presentacion%20-%20Tercera.mp4'};
    let front=null,current='',generation=0,socket,goodbyePending=false;
    function updateAssets(assets){
      if(assets?.entrada)files.entrada='/rulo-animaciones/'+encodeURIComponent(assets.entrada);
      if(assets?.espera)files.espera='/rulo-animaciones/'+encodeURIComponent(assets.espera);
      if(assets?.tercera)files.despedida='/rulo-animaciones/'+encodeURIComponent(assets.tercera);
    }
    function stop(){
      generation++;
      videos.forEach(video=>{video.pause();video.loop=false;video.classList.remove('visible');video.onended=null;});
      front=null;current='';goodbyePending=false;
    }
    function play(kind){
      const ticket=++generation,old=front,target=videos.find(video=>video!==old)||videos[0];
      target.pause();target.classList.remove('visible');target.onended=null;target.onerror=null;
      target.loop=kind==='espera'&&!goodbyePending;target.src=files[kind]+'?v='+Date.now();target.load();current=kind;
      target.onloadedmetadata=()=>{
        if(ticket!==generation)return;
        target.play().then(()=>{
          const show=()=>{
            if(ticket!==generation)return;
            if(old&&old!==target){old.pause();old.classList.remove('visible');}
            target.classList.add('visible');front=target;
            if(kind==='entrada')target.onended=()=>{if(ticket===generation&&current==='entrada')play('espera');};
            if(kind==='espera')target.onended=()=>{if(ticket!==generation||current!=='espera')return;if(goodbyePending)play('despedida');else play('espera');};
            if(kind==='despedida')target.onended=()=>{if(ticket===generation&&current==='despedida')stop();};
          };
          if(typeof target.requestVideoFrameCallback==='function')target.requestVideoFrameCallback(show);else requestAnimationFrame(show);
        }).catch(error=>{if(ticket===generation){console.error('[Rulo presentación] No se pudo reproducir el video:',error);stop();}});
      };
      target.onerror=()=>{if(ticket===generation){console.error('[Rulo presentación] No se pudo cargar:',kind);stop();}};
    }
    function onMessage(event){
      let data;try{data=JSON.parse(event.data)}catch(_){return}
      if(data.type==='rulo_presentation_control'&&data.action==='presentacion'){goodbyePending=false;play('entrada');}
      else if(data.type==='rulo_presentation_control'&&data.action==='despedida'){
        if(current==='despedida')return;
        if(current==='espera'){goodbyePending=true;front.loop=false;}
        else if(current==='entrada')goodbyePending=true;
        else {goodbyePending=false;play('despedida');}
      }
      else if(data.type==='rulo_presentation_stop')stop();
      else if(data.type==='rulo_animation_assets_updated')updateAssets(data.presentation);
    }
    function connect(){
      socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/?client=rulo-presentation');
      socket.addEventListener('message',onMessage);
      socket.addEventListener('close',()=>{stop();setTimeout(connect,2000);});
    }
    fetch('/api/rulo-animation-status').then(response=>response.json()).then(data=>updateAssets(data.presentation)).catch(()=>{}).finally(connect);
  })();
  </script>
</body>
</html>
