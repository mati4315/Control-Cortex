<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rulo | Ahora suena + Chat</title>
<link rel="icon" href="/ssn/favicon.ico">
<style>
@font-face {
  font-family:'Sora'; font-style:normal; font-weight:400; font-display:swap;
  src:url(/ssn/thirdparty/xMQbuFFYT72XzQUpDg.woff2) format('woff2');
}
@font-face {
  font-family:'Sora'; font-style:normal; font-weight:700; font-display:swap;
  src:url(/ssn/thirdparty/xMQbuFFYT72XzQspDre2.woff2) format('woff2');
}

:root {
  --accent:   #ffdd00;
  --accent2:  #ff4747;
  --bg:       #1a1a2e;
  --bg2:      #16213e;
  --border:   #000;
  --text:     #fff;
  --muted:    #ffe066;
  --font:     'Sora','Comic Sans MS','Segoe UI',sans-serif;
  --radius:   14px;
  --bw:       3px;
  --shadow:   4px 4px 0px #000;
  --scale: 1;
  --overlay-width: 720px;
  --comment-width: 320px;
  --comment-bottom: 8px;
  --comment-scale: 1;
  --comment-text-lines: 4;
}

* { box-sizing: border-box; }

/* El escalado de letra tiene que ir en el root: los rem de la tarjeta y de los
   comentarios se resuelven contra <html>, no contra #stage. Antes se aplicaba a
   #stage y por eso "Tamaño de letra (escala)" no tenia ningun efecto. */
html { font-size: calc(16px * var(--scale)); }

html, body {
  margin: 0; padding: 0;
  /* height:100% deja que #comments suba por encima de la tarjeta sin que el
     overflow:hidden del body lo recorte (se recorta solo contra la fuente OBS). */
  height: 100%;
  font-family: var(--font);
  background: transparent;
  color: var(--text);
  overflow: hidden;
}

/* Todo escala con --scale: el font-size base del stage define el rem. */
#stage {
  position: relative;
  width: max-content;
  max-width: 100vw;
  font-size: calc(16px * var(--scale));
}

/* ── Tarjeta Now Playing (estilo cómic) ───────────────────── */
#overlay {
  display: flex;
  align-items: stretch;
  width: var(--overlay-width);
  max-width: 100vw;
  border-radius: var(--radius);
  border: var(--bw) solid var(--border);
  box-shadow: var(--shadow);
  overflow: hidden;
  background: var(--bg);
  transition: opacity 200ms, transform 200ms;
  position: relative;
}

.hidden-state {
  opacity: 0;
  transform: translateY(8px);
  pointer-events: none;
}

.art {
  width: 90px;
  min-width: 90px;
  flex-shrink: 0;
  border-right: var(--bw) solid var(--border);
  position: relative;
  overflow: hidden;
}
.art img { width: 100%; height: 100%; object-fit: cover; display: block; }

.meta {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 10px 12px 8px;
  gap: 4px;
  background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 100%);
  height: var(--card-height, auto);
}

.top-row { display: flex; align-items: center; gap: 8px; min-width: 0; }

.title {
  font-size: 1rem;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
  text-shadow: 2px 2px 0 #000;
  letter-spacing: -0.01em;
  flex: 1;
  min-width: 0;
}

.status {
  background: var(--accent);
  color: #000;
  font-size: 0.62rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 2px 7px;
  border-radius: 4px;
  border: 1.5px solid #000;
  box-shadow: 2px 2px 0 #000;
  flex-shrink: 0;
}

.artist {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 1px 1px 0 #000;
}

/* Separador flexible: acá cae el alto extra de la tarjeta (entre artist y progress). */
#vspacer { flex: 1 1 0; min-height: 0; }

.progress { display: flex; align-items: center; gap: 6px; }
.bar {
  flex: 1;
  background: rgba(255,255,255,0.12);
  height: 6px;
  border-radius: 999px;
  border: 1px solid rgba(0,0,0,0.5);
  overflow: hidden;
  position: relative;
}
.bar::after {
  content: "";
  position: absolute; inset: 0;
  background: var(--accent);
  width: var(--progress, 0%);
  transition: width 150ms linear;
  border-radius: 999px;
}
.time { font-size: 0.7rem; color: rgba(255,255,255,0.7); min-width: 34px; font-weight: 600; }

#lyric-line {
  font-size: 1.08rem;
  font-weight: 900;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: center;
  text-shadow: 2px 2px 0 #000, 0 0 20px rgba(255,221,0,0.70);
  letter-spacing: 0.02em;
  padding: 4px 4px 2px;
  min-height: 1.5em;
  transition: opacity 300ms ease;
  border-top: 1px dashed rgba(255,221,0,0.30);
  margin-top: 3px;
}
#lyric-line.empty { opacity: 0.3; color: var(--muted); font-style: italic; font-weight: 400; }
#lyric-line.fade-out { opacity: 0; }

#overlay::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  background: var(--accent);
  z-index: 10;
}

/* ── Comentarios: minimalistas, superpuestos, derecha → izquierda ── */
#comments {
  /* Misma caja que la tarjeta: inset:0 hace que este contenedor mida exactamente
     lo mismo que #overlay, y las burbujas se acomodan adentro con el padding
     (derecha + "Distancia desde abajo"). Asi no se van al fondo de la fuente. */
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: row;
  justify-content: flex-end;
  align-items: flex-end;
  gap: calc(10px * var(--comment-scale, 1));
  padding: 0 8px var(--comment-bottom, 8px) 0;
  pointer-events: none;
  z-index: 20;
}
#comments[data-position="top-right"] {
  align-items: flex-start;
  padding: var(--comment-bottom, 8px) 8px 0 0;
}

.comment {
  display: flex;
  align-items: center;
  gap: calc(8px * var(--comment-scale, 1));
  background: rgba(10,12,18,0.66);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: calc(12px * var(--comment-scale, 1));
  padding: calc(7px * var(--comment-scale, 1)) calc(11px * var(--comment-scale, 1));
  width: var(--comment-width);
  min-width: 0; /* permite achicarse para entrar en la caja de la tarjeta */
  max-width: calc(100vw - 20px);
  color: #fff;
  box-shadow: 0 4px 16px rgba(0,0,0,0.35);
  will-change: transform, opacity;
}
.comment .c-avatar {
  width: calc(30px * var(--comment-scale, 1));
  height: calc(30px * var(--comment-scale, 1));
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  background: rgba(255,255,255,0.12);
}
.comment .c-body { min-width: 0; flex: 1; }
.comment .c-name {
  font-size: calc(0.72rem * var(--comment-scale, 1));
  font-weight: 700;
  color: var(--accent);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.comment .c-text {
  font-size: calc(0.82rem * var(--comment-scale, 1));
  line-height: 1.28;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  /* 1.28em = un renglon exacto (line-height). Los comentarios mas largos que
     esto hacen scroll automatico hacia abajo (ver autoScrollComment). */
  max-height: calc(var(--comment-text-lines, 4) * 1.28em);
  overflow: hidden;
  color: #f2f4f7;
}

.sr-only {
  position:absolute;width:1px;height:1px;padding:0;
  margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
</style>
</head>
<body>

<div id="stage">
  <div id="overlay" class="hidden-state">
    <div class="art" id="artWrap">
      <img id="art" alt="Album art">
    </div>
    <div class="meta">
      <div class="top-row">
        <div class="title"  id="title">Waiting for Spotify…</div>
        <div class="status" id="status">IDLE</div>
      </div>
      <div class="artist" id="artist">—</div>
      <div id="vspacer"></div>
      <div class="progress" id="progressRow">
        <div class="time" id="currentTime">0:00</div>
        <div class="bar"  id="bar"></div>
        <div class="time" id="totalTime">0:00</div>
      </div>
      <div id="lyric-line" class="empty">♪</div>
    </div>
  </div>
  <div id="comments" data-position="bottom-right"></div>
</div>

<span class="sr-only" id="ariaStatus" aria-live="polite"></span>

<script>
(function(){
  var urlParams = new URLSearchParams(location.search);
  var sessionId = urlParams.get('session') || urlParams.get('room') || '';
  var fallbackArt = '/ssn/sources/images/unknown.png';

  // DOM
  var overlayEl    = document.getElementById('overlay');
  var titleEl      = document.getElementById('title');
  var artistEl     = document.getElementById('artist');
  var statusEl     = document.getElementById('status');
  var artEl        = document.getElementById('art');
  var artWrap      = document.getElementById('artWrap');
  var progressRow  = document.getElementById('progressRow');
  var currentTimeEl= document.getElementById('currentTime');
  var totalTimeEl  = document.getElementById('totalTime');
  var barEl        = document.getElementById('bar');
  var lyricLineEl  = document.getElementById('lyric-line');
  var ariaStatus   = document.getElementById('ariaStatus');
  var commentsEl   = document.getElementById('comments');

  // Config (la manda Cortex y se actualiza en vivo)
  var config = {
    showComments: true, maxComments: 2, commentDurationSec: 0,
    commentPosition: 'bottom-right', commentWidth: 320, commentTextLines: 4,
    commentBottom: 8, commentScale: 1, commentDurationSec: 0, commentScrollPauseSec: 3,
    showLyrics: true, showArt: true, showProgress: true, showStatus: true,
    accent: '#ffdd00', fontSize: 1, overlayWidth: 720, cardHeight: 0, brand: 'Anormalia 22'
  };
  var showLyrics = true;

  function applyConfig(cfg) {
    if (!cfg || typeof cfg !== 'object') return;
    config = cfg;
    showLyrics = !!cfg.showLyrics;
    document.documentElement.style.setProperty('--accent', cfg.accent || '#ffdd00');
    document.documentElement.style.setProperty('--scale', String(cfg.fontSize || 1));
    document.documentElement.style.setProperty('--overlay-width', (cfg.overlayWidth || 720) + 'px');
    document.documentElement.style.setProperty('--comment-width', (cfg.commentWidth || 320) + 'px');
    document.documentElement.style.setProperty('--comment-text-lines', String(cfg.commentTextLines || 4));
    document.documentElement.style.setProperty('--comment-bottom', (cfg.commentBottom === undefined ? 8 : cfg.commentBottom) + 'px');
    document.documentElement.style.setProperty('--comment-scale', String(cfg.commentScale || 1));
    document.documentElement.style.setProperty('--card-height', (cfg.cardHeight > 0 ? cfg.cardHeight + 'px' : 'auto'));
    artWrap.style.display     = cfg.showArt ? '' : 'none';
    progressRow.style.display = cfg.showProgress ? '' : 'none';
    statusEl.style.display    = cfg.showStatus ? '' : 'none';
    lyricLineEl.style.display = cfg.showLyrics ? '' : 'none';
    commentsEl.style.display  = cfg.showComments ? 'flex' : 'none';
    var top = cfg.commentPosition === 'top-right';
    commentsEl.dataset.position = top ? 'top-right' : 'bottom-right';
    statusEl.textContent = cfg.brand || 'Anormalia 22';

    // La lista de espera depende de la duracion: sin duracion no hay turnos que
    // esperar (se descarta), y si subio el maximo conviene llenar los lugares libres.
    if (Array.isArray(commentQueue)) {
      if (!cfg.showComments || !(Number(cfg.commentDurationSec) > 0)) commentQueue.length = 0;
      else drainQueue();
    }
  }

  // Spotify state
  var state = {
    track:null, status:'idle', isPlaying:false,
    progressMs:0, durationMs:0, receivedAt:Date.now(),
    sourceReceivedAt:0, anchorAt:Date.now()
  };

  // Lyrics state
  var lyr = { lines:[], currentIdx:-1, trackId:null, requestToken:0, loading:false, instrumental:false };

  function trackKey(track) {
    if (!track) return '';
    return String(track.uri || track.id || '') + '|' +
      String(track.artist || '') + '|' + String(track.name || '');
  }
  function formatMs(ms) {
    var total = Math.max(0, Math.floor((ms||0)/1000));
    return Math.floor(total/60) + ':' + String(total%60).padStart(2,'0');
  }
  function getElapsed() {
    var e = state.progressMs || 0;
    if (state.status==='playing'||state.isPlaying)
      e += Math.max(0, Date.now() - (state.anchorAt||Date.now()));
    return Math.max(0, Math.min(state.durationMs||0, e));
  }
  function updateProgressBar() {
    if (!state.durationMs) {
      barEl.style.setProperty('--progress','0%');
      currentTimeEl.textContent='0:00'; totalTimeEl.textContent='0:00';
      return;
    }
    var e = getElapsed();
    barEl.style.setProperty('--progress',(e/state.durationMs*100)+'%');
    currentTimeEl.textContent=formatMs(e);
    totalTimeEl.textContent=formatMs(state.durationMs);
  }

  // LRC parser
  function parseLRC(text) {
    if (!text) return [];
    var result=[], re=/\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/g, m;
    while((m=re.exec(text))!==null){
      var ms=(parseInt(m[1])*60+parseInt(m[2]))*1000+parseInt(m[3].padEnd(3,'0'));
      var line=m[4].trim();
      if(line) result.push({timeMs:ms,text:line});
    }
    return result.sort(function(a,b){return a.timeMs-b.timeMs;});
  }
  function setLyricDisplay(text, empty) {
    lyricLineEl.classList.add('fade-out');
    setTimeout(function(){
      lyricLineEl.textContent = text || '♪';
      lyricLineEl.classList.toggle('empty', !!empty);
      lyricLineEl.classList.remove('fade-out');
    }, 200);
  }

  // Letras: primero Cortex (cache SQLite), después LRCLIB.
  async function pedirLetrasACortex(track){
    var params=new URLSearchParams({title:track.name,artist:track.artist});
    if(track.album) params.set('album',track.album);
    if(track.duration) params.set('duration',track.duration);
    if(track.uri) params.set('track',String(track.uri).replace('spotify:track:',''));
    var res=await fetch('api/letras?'+params,{headers:{'Accept':'application/json'}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    var data=await res.json();
    if(!data||data.ok!==true||!data.letra) return null;
    var letra=data.letra;
    if(letra.instrumental) return {instrumental:true,lines:[]};
    if(!letra.lines||!letra.lines.length) return null;
    return { instrumental:false, lines:letra.lines.map(function(l){return{timeMs:l.startMs,text:l.text};}) };
  }
  async function pedirLetrasALrclib(track){
    var params=new URLSearchParams({artist_name:track.artist,track_name:track.name});
    if(track.album) params.set('album_name',track.album);
    if(track.duration) params.set('duration',Math.round(track.duration/1000));
    var res=await fetch('https://lrclib.net/api/get?'+params,{
      headers:{'Lrclib-Client':'Rulo Unified Overlay'}
    });
    if(res.status===404) return null;
    if(!res.ok) throw new Error('HTTP '+res.status);
    var data=await res.json();
    if(data.instrumental) return {instrumental:true,lines:[]};
    var synced=parseLRC(data.syncedLyrics);
    if(synced.length>0) return {instrumental:false,lines:synced};
    if(data.plainLyrics){
      return {instrumental:false,lines:data.plainLyrics.split('\n').filter(function(l){return l.trim();})
        .map(function(t,i){return{timeMs:i*3500,text:t};})};
    }
    return null;
  }
  async function fetchLyrics(track) {
    if(!track||!track.name||!track.artist) return;
    var trackId = trackKey(track);
    if(lyr.trackId===trackId) return;
    var requestToken = ++lyr.requestToken;
    lyr.trackId=trackId; lyr.lines=[]; lyr.currentIdx=-1;
    lyr.loading=true; lyr.instrumental=false;
    setLyricDisplay('Buscando letras…', true);
    try {
      var letra=null;
      try { letra=await pedirLetrasACortex(track); }
      catch(e){ console.warn('[Lyrics] Cortex no respondio, LRCLIB',e); }
      if(requestToken!==lyr.requestToken) return;
      if(!letra) letra=await pedirLetrasALrclib(track);
      if(requestToken!==lyr.requestToken) return;
      if(!letra){setLyricDisplay('Sin letras',true);return;}
      if(letra.instrumental){ lyr.instrumental=true; setLyricDisplay('🎸 Instrumental',true); return; }
      lyr.lines=letra.lines;
    } catch(e){
      if(requestToken!==lyr.requestToken) return;
      console.warn('[Lyrics]',e);
      setLyricDisplay('',true);
    } finally {
      if(requestToken===lyr.requestToken) lyr.loading=false;
    }
  }
  function updateLyricsLine() {
    if(!showLyrics||lyr.lines.length===0) return;
    var elapsed=getElapsed(), idx=0;
    for(var i=0;i<lyr.lines.length;i++){
      if(lyr.lines[i].timeMs<=elapsed) idx=i; else break;
    }
    if(idx===lyr.currentIdx) return;
    lyr.currentIdx=idx;
    setLyricDisplay(lyr.lines[idx].text, false);
  }

  // Render now-playing
  function render() {
    var track=state.track, status=state.status;
    var shouldHide = !track && false; // por defecto no se oculta; el dashboard controla que mostrar
    if(shouldHide){ overlayEl.classList.add('hidden-state'); return; }
    overlayEl.classList.remove('hidden-state');
    if(track){
      var requester = String(track.requester||'').trim();
      titleEl.textContent  = (track.name||'Unknown track') +
        (requester ? '   .....Pedido de ' + requester : '');
      artistEl.textContent = track.artist||'';
      artEl.src = track.imageUrl||fallbackArt;
      if(showLyrics) fetchLyrics(track);
    } else {
      titleEl.textContent  = status==='stopped'?'Esperando Canción...':'Waiting for Spotify…';
      artistEl.textContent = '';
      artEl.src = fallbackArt;
    }
    updateProgressBar();
    ariaStatus.textContent=(track?track.name:'No track')+' '+status;
  }

  // Procesa el estado de Spotify que llega por el WebSocket de Cortex.
  function processSpotify(payload){
    if(!payload||typeof payload!=='object') return;
    var incomingTrackKey=trackKey(payload.track||null);
    var currentTrackKey=trackKey(state.track);
    var incomingSourceTime=Number(payload.receivedAt)||0;
    if(incomingTrackKey && incomingTrackKey===currentTrackKey &&
       incomingSourceTime>0 && state.sourceReceivedAt>0 &&
       incomingSourceTime<state.sourceReceivedAt) return;
    var prevTrackKey=trackKey(state.track);
    var localArrival=Date.now();
    var parsedProgressMs=Number(payload.progressMs||payload.progress||0);
    var rawProgressMs=Number.isFinite(parsedProgressMs)?parsedProgressMs:0;
    var payloadIsPlaying=!!payload.isPlaying || payload.status==='playing' || payload.status==='switching';
    var transitMs=incomingSourceTime && payloadIsPlaying
      ? Math.max(0, Math.min(5000, localArrival-incomingSourceTime)) : 0;
    state={
      track:     payload.track||null,
      status:    payload.status||(payload.isPlaying?'playing':(payload.track?'paused':'idle')),
      isPlaying: payloadIsPlaying,
      progressMs:Math.max(0, rawProgressMs+transitMs),
      durationMs:payload.durationMs||payload.duration||(payload.track&&payload.track.duration)||0,
      receivedAt:payload.receivedAt||localArrival,
      sourceReceivedAt:incomingSourceTime,
      anchorAt:localArrival,
      switchingAt:payload.status==='switching' ? localArrival : 0
    };
    if(showLyrics&&trackKey(state.track)!==prevTrackKey){
      lyr.trackId=null; lyr.requestToken++; lyr.lines=[]; lyr.currentIdx=-1;
    }
    render();
  }

  // ── Comentarios: derecha → izquierda, máximo config.maxComments ──
  var seenIds = {};

  // Comentario que no entra en los renglones configurados: baja despacio, espera
  // abajo y vuelve a empezar desde arriba, en bucle, para poder leerlo entero.
  //
  // Clave: cuando entra un segundo comentario las burbujas se achican, el texto
  // se hace mas alto y el fondo "se corre". Por eso el maximo se vuelve a medir
  // durante el recorrido, y un ResizeObserver reinicia el ciclo si el ancho cambio.
  function autoScrollComment(el) {
    if (!el || el._autoScroll) return;
    var HOLD_TOP_MS = 1500;    // pausa arriba antes de arrancar
    var PX_PER_SECOND = 22;    // velocidad lenta
    var REMEASURE_MS = 200;    // cada cuanto se recalcula el fondo

    var ctrl = { running: false, timer: null, raf: null };
    el._autoScroll = ctrl;

    function maxScroll() { return Math.max(0, el.scrollHeight - el.clientHeight); }
    function pauseMs() {
      var v = Number(config.commentScrollPauseSec);
      return isFinite(v) && v > 0 ? v * 1000 : 0;
    }

    function startCycle() {
      if (ctrl.running || !el.isConnected) return;
      if (maxScroll() <= 2) return;    // entra completo: no hay nada que mover
      ctrl.running = true;
      el.scrollTop = 0;
      ctrl.timer = setTimeout(function () {
        if (!el.isConnected) { ctrl.running = false; return; }
        var total = maxScroll();
        var duration = Math.max(1800, (total / PX_PER_SECOND) * 1000);
        var start = null, lastMeasure = 0, cached = total;
        function step(ts) {
          if (!el.isConnected) { ctrl.running = false; return; }
          if (start === null) start = ts;
          if (ts - lastMeasure > REMEASURE_MS) { cached = maxScroll(); lastMeasure = ts; }
          var p = Math.min(1, (ts - start) / duration);
          el.scrollTop = cached * p;
          if (p < 1) {
            ctrl.raf = requestAnimationFrame(step);
          } else {
            el.scrollTop = maxScroll();  // fondo exacto (el ultimo renglon se lee)
            ctrl.running = false;
            ctrl.timer = setTimeout(startCycle, pauseMs());
          }
        }
        ctrl.raf = requestAnimationFrame(step);
      }, HOLD_TOP_MS);
    }
    ctrl.start = startCycle;

    // Si el texto cambia de tamano (llego otro comentario y se achico la burbuja)
    // y ahora si desborda, arrancar el ciclo.
    if (typeof ResizeObserver === 'function') {
      var ro = new ResizeObserver(function () {
        if (!el.isConnected) { try { ro.disconnect(); } catch (_) {} return; }
        if (!ctrl.running && maxScroll() > 2) startCycle();
      });
      ro.observe(el);
      ctrl.observer = ro;
    }

    startCycle();
  }

  // Al sacar una burbuja hay que cortar timers y el observer.
  function disposeBubble(bubble) {
    var el = bubble && bubble.querySelector ? bubble.querySelector('.c-text') : null;
    var ctrl = el && el._autoScroll;
    if (ctrl) {
      if (ctrl.timer) clearTimeout(ctrl.timer);
      if (ctrl.raf) cancelAnimationFrame(ctrl.raf);
      if (ctrl.observer) { try { ctrl.observer.disconnect(); } catch (_) {} }
      ctrl.running = false;
    }
  }

  // ── Lista de espera ──
  // Con una duracion configurada, un comentario nuevo NO pisa a los que estan en
  // pantalla: espera su turno y entra cuando uno se va al cumplir su tiempo.
  // Con duracion 0 no hay forma de liberar lugar, asi que se mantiene el
  // reemplazo del mas viejo (si no, la pantalla quedaria congelada para siempre).
  var commentQueue = [];
  var QUEUE_LIMIT = 50;

  function drainQueue() {
    while (commentQueue.length && config.showComments &&
           commentsEl.children.length < config.maxComments) {
      renderComment(commentQueue.shift());
    }
  }

  function addComment(item) {
    if (!config.showComments || !item || !item.comment) return;
    if (!item.id) item.id = String(item.messageId || '') || (item.requester + '|' + item.comment);
    var now = Date.now();
    if (seenIds[item.id] && now - seenIds[item.id] < 60000) return; // dedupe
    seenIds[item.id] = now;

    // Sin lugar libre y con duracion: a la lista de espera.
    if (config.commentDurationSec > 0 && commentsEl.children.length >= config.maxComments) {
      commentQueue.push(item);
      while (commentQueue.length > QUEUE_LIMIT) commentQueue.shift();
      return;
    }
    renderComment(item);
  }

  function renderComment(item) {
    var bubble = document.createElement('div');
    bubble.className = 'comment';
    bubble._id = item.id;

    var avatar = document.createElement('img');
    avatar.className = 'c-avatar';
    avatar.alt = '';
    if (item.chatimg) avatar.src = item.chatimg; else avatar.style.visibility = 'hidden';

    var body = document.createElement('div');
    body.className = 'c-body';
    var name = document.createElement('div');
    name.className = 'c-name';
    name.textContent = String(item.requester || 'Anónimo');
    var text = document.createElement('div');
    text.className = 'c-text';
    text.textContent = String(item.comment).slice(0, 500);
    body.appendChild(name);
    body.appendChild(text);
    bubble.appendChild(avatar);
    bubble.appendChild(body);

    // Posiciones previas para el FLIP (los que quedan se deslizan a la izquierda)
    var existing = Array.prototype.slice.call(commentsEl.children);
    existing.forEach(function(el){ el._x = el.offsetLeft; });

    commentsEl.appendChild(bubble);

    // Red de seguridad: si el maximo bajo por configuracion, se va el mas viejo.
    // (No se drena aca: el lugar que se libera lo ocupa este mismo comentario.)
    while (commentsEl.children.length > config.maxComments) {
      var first = commentsEl.children[0];
      disposeBubble(first);
      first.remove();
      delete seenIds[first._id];
    }

    // FLIP: animar a la izquierda los que quedaron
    Array.prototype.slice.call(commentsEl.children).forEach(function(el){
      if (el === bubble) return;
      var dx = (el._x || 0) - el.offsetLeft;
      if (dx) {
        el.style.transition = 'none';
        el.style.transform = 'translateX(' + dx + 'px)';
        requestAnimationFrame(function(){
          el.style.transition = 'transform 420ms cubic-bezier(.2,.7,.2,1)';
          el.style.transform = 'translateX(0)';
        });
      }
    });

    // El nuevo entra desde la derecha
    bubble.style.transform = 'translateX(40px)';
    bubble.style.opacity = '0';
    requestAnimationFrame(function(){
      bubble.style.transition = 'transform 420ms cubic-bezier(.2,.7,.2,1), opacity 340ms ease';
      bubble.style.transform = 'translateX(0)';
      bubble.style.opacity = '1';
    });

    // Comentario largo: baja solo, en bucle, para poder leerlo entero.
    autoScrollComment(text);
    // Al entrar uno nuevo los anteriores se achican y el texto crece: si ahora
    // desbordan, que arranquen (o sigan) el ciclo contra el fondo nuevo.
    Array.prototype.slice.call(commentsEl.children).forEach(function(other){
      if (other === bubble) return;
      var t = other.querySelector('.c-text');
      if (t && t._autoScroll && t._autoScroll.start) t._autoScroll.start();
    });

    // Auto-ocultar al cumplirse el tiempo; recien ahi entra el que esperaba.
    if (config.commentDurationSec > 0) {
      (function(b, id){
        setTimeout(function(){
          if (!b.isConnected) return;
          b.style.transition = 'opacity 550ms ease, transform 550ms ease';
          b.style.opacity = '0';
          b.style.transform = 'translateX(24px)';
          setTimeout(function(){
            disposeBubble(b); b.remove(); delete seenIds[id];
            drainQueue();   // se libero un lugar: pasa el siguiente de la lista
          }, 600);
        }, config.commentDurationSec * 1000);
      })(bubble, item.id);
    }
  }

  // ── Transporte: WebSocket de Cortex ──
  function connectWS() {
    var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var ws = new WebSocket(protocol + '//' + location.host);
    var attempts = 1;
    ws.onopen = function(){ attempts = 1; };
    ws.onmessage = function(event){
      if(!event.data) return;
      try {
        var data = JSON.parse(event.data);
        if (data.type === 'spotify_overlay' && data.spotify) processSpotify(data.spotify);
        else if (data.type === 'rulo_chat_item') {
          // En la repeticion inicial del historial, no traer comentarios viejos.
          if (data.item && Date.now() - (data.item.timestamp || 0) < 120000) addComment(data.item);
        }
        else if (data.type === 'rulo_unified_config_updated') applyConfig(data.config);
      } catch(e) {}
    };
    ws.onerror = function(){ try{ws.close();}catch(_){} };
    ws.onclose = function(){ setTimeout(connectWS, Math.min(5000, 500*attempts)); attempts++; };
  }

  // Config inicial por HTTP (y luego en vivo por WS)
  fetch('/api/rulo-unified-config')
    .then(function(r){ return r.json(); })
    .then(function(d){ if (d && d.config) applyConfig(d.config); })
    .catch(function(){});
  connectWS();

  render();
  setInterval(function(){ updateProgressBar(); if(showLyrics) updateLyricsLine(); }, 250);
})();
</script>
</body>
</html>
