<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comentario destacado</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:system-ui,Segoe UI,sans-serif}.wrap{position:absolute;left:50%;bottom:5%;transform:translate(-50%,24px);width:min(94%,1100px);opacity:0;transition:opacity .3s,transform .3s}.wrap.show{opacity:1;transform:translate(-50%,0)}.card{display:flex;align-items:center;gap:22px;padding:24px 30px;border:2px solid #ffffff3a;border-radius:22px;background:linear-gradient(120deg,#101722f2,#202e42ee);box-shadow:0 14px 42px #0009;backdrop-filter:blur(10px)}.avatar{width:78px;height:78px;flex:none;object-fit:cover;border-radius:50%;border:3px solid #20d879;background:#27384d}.body{min-width:0;flex:1}.label{font-size:15px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:#62e19d}.name{font-size:23px;font-weight:800;margin-top:2px}.message{font-size:30px;line-height:1.18;font-weight:700;overflow-wrap:anywhere;margin-top:5px;text-shadow:0 2px 2px #0006}.platform{font-size:12px;color:#9cabc0;margin-top:9px}@media(max-width:640px){.card{padding:15px;gap:13px}.avatar{width:54px;height:54px}.name{font-size:18px}.message{font-size:22px}}
</style></head><body><div class="wrap" id="wrap"><div class="card"><img id="avatar" class="avatar" alt=""><div class="body"><div class="label">Comentario destacado</div><div id="name" class="name"></div><div id="message" class="message"></div><div id="platform" class="platform">Facebook</div></div></div></div>
<script>
  const wrap=document.getElementById('wrap'),avatar=document.getElementById('avatar');let hideTimer;
  function show(m){if(!m)return;document.getElementById('name').textContent=m.chatname||'Usuario';document.getElementById('message').textContent=m.chatmessage||'';document.getElementById('platform').textContent=`${m.type||'facebook'} · ${new Date(m.timestamp||Date.now()).toLocaleTimeString()}`;avatar.src=m.chatimg||'';avatar.style.visibility=m.chatimg?'visible':'hidden';wrap.classList.add('show');clearTimeout(hideTimer);hideTimer=setTimeout(()=>wrap.classList.remove('show'),18000)}
  const es=new EventSource('/api/events');es.addEventListener('featured_message',e=>{try{show(JSON.parse(e.data))}catch(_){}});es.addEventListener('featured_clear',()=>wrap.classList.remove('show'));fetch('/api/featured').then(r=>r.json()).then(d=>d.message&&show(d.message)).catch(()=>{});
</script></body></html>
