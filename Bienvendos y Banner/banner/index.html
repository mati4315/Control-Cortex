<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDelu Social Loop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/banner/css/banner.css">
</head>
<body class="overlay-page">
  <main id="onairPreview" class="onair-preview">
    <section class="lower-third" aria-label="Social loop lower third">
      <div class="bevel"></div>
      <div class="icon-rail" id="current-icon" aria-hidden="true"></div>
      <div class="copy-rail">
        <div class="top-line" id="social-label">Instagram</div>
        <div class="bottom-line" id="social-handle">/cdelu.ar</div>
      </div>
      <div class="accent-block"></div>
    </section>
  </main>

  <script src="/banner/js/shared.js"></script>
  <script src="/banner/js/banner.js"></script>
</body>
</html>
