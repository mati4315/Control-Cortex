<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDelu Social Loop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/banner/css/banner.css">
</head>
<body class="overlay-page">
  <main id="onairPreview" class="onair-preview">
    <section class="lower-third" aria-label="Social loop lower third">
      <div class="bevel"></div>
      <div class="icon-rail" id="current-icon" aria-hidden="true"></div>
      <div class="copy-rail">
        <div class="top-line" id="social-label">Instagram</div>
        <div class="bottom-line" id="social-handle">/cdelu.ar</div>
      </div>
      <div class="accent-block"></div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/banner/js/shared.js"></script>
  <script src="/banner/js/banner.js"></script>
  <script>
    (function() {
      var socket = io();
      var firstLoad = true;

      function loadBannerFromServer(bannerData) {
        if (!bannerData || typeof bannerData !== 'object') return;
        // Only override if server has data and it's different from current
        var current = window.BannerStudio.getState();
        if (firstLoad || JSON.stringify(bannerData.items) !== JSON.stringify(current.items) || bannerData.loopInterval !== current.loopInterval || bannerData.randomMode !== current.randomMode) {
          window.BannerStudio.setState(bannerData);
          firstLoad = false;
        }
      }

      socket.on('initSettings', function(settings) {
        if (settings && settings.banner) {
          loadBannerFromServer(settings.banner);
        }
      });

      socket.on('bannerUpdated', function(bannerData) {
        loadBannerFromServer(bannerData);
      });

      socket.on('settingsUpdated', function(settings) {
        if (settings && settings.banner) {
          loadBannerFromServer(settings.banner);
        }
      });
    })();
  </script>
</body>
</html>
