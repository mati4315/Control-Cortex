<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=720, height=1280">
  <title>Lotería Ball Widget - OBS</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 720px;
      height: 1280px;
      overflow: hidden;
      background: transparent;
      position: relative;
    }

    #ticker-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18px;
      width: 100%;
      height: 64px;
      display: flex;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0s linear 0.3s;
      pointer-events: none;
      z-index: 35;
    }

    #ticker-overlay.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0s linear 0s;
    }

    #ball-queue-status {
      display: none;
      position: absolute;
      top: 22px;
      right: 20px;
      width: min(300px, calc(100% - 40px));
      padding: 12px 14px;
      border: 1px solid rgba(139, 92, 246, 0.48);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(10, 18, 31, 0.94), rgba(28, 20, 55, 0.92));
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      font-family: 'Montserrat', sans-serif;
      z-index: 40;
      pointer-events: none;
    }

    #ball-queue-status.visible { display: block; }

    .ball-queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      color: #c4b5fd;
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    #ball-queue-count {
      display: inline-flex;
      min-width: 26px;
      height: 26px;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: linear-gradient(135deg, #8b5cf6, #c026d3);
      color: #fff;
      font-size: 0.8rem;
      letter-spacing: 0;
    }

    #ball-queue-list {
      display: grid;
      gap: 5px;
      list-style: none;
    }

    #ball-queue-list li {
      overflow: hidden;
      color: rgba(248, 250, 252, 0.9);
      font-size: 0.78rem;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #ball-queue-list li span {
      margin-right: 7px;
      color: #d8b4fe;
      font-weight: 900;
    }

    .ticker-shell {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: stretch;
      overflow: hidden;
      border-radius: 0;
      background: linear-gradient(105deg, rgba(10, 18, 31, 0.90) 0%, rgba(23, 30, 51, 0.92) 55%, rgba(12, 18, 32, 0.94) 100%);
      border: 1px solid rgba(139, 92, 246, 0.28);
      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .ticker-viewport {
      flex: 1 1 auto;
      overflow: hidden;
      position: relative;
      width: 100%;
    }

    .ticker-track {
      height: 100%;
      display: flex;
      align-items: center;
      width: max-content;
      animation: ticker-scroll linear infinite;
      will-change: transform;
    }

    .ticker-group {
      display: flex;
      align-items: center;
      gap: 54px;
      padding-right: 54px;
      width: max-content;
      flex: 0 0 auto;
    }

    .ticker-item {
      flex: 0 0 auto;
    }

    .ticker-text {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      color: #f8fafc;
      font-family: 'Montserrat', sans-serif;
      font-size: 1.08rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @keyframes ticker-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    /* ══════════════════════════════════════
       BALL WRAPPER  (JS moves this)
       ══════════════════════════════════════ */
    #ball-wrapper {
      position: absolute;
      width: 96px;
      height: 96px;
      top: -120px;
      left: 620px;
    }

    /* ══════════════════════════════════════
       BASE SPHERE
       ══════════════════════════════════════ */
    .lottery-ball {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      --stop-tilt-final: -24deg;
      --stop-tilt-overshoot: -32deg;
    }

    .lottery-ball.rolling { animation: counter-spin 3.4s linear infinite; }
    .lottery-ball.rolling.spin-fast { animation-duration: 1.05s; }
    .lottery-ball.rolling.spin-slow { animation-duration: 3.1s; }
    .lottery-ball.spin-stop {
      animation: stop-settle 0.55s cubic-bezier(0.18, 0.9, 0.28, 1) 1 both;
    }

    .ball-body {
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    /* Ball number wrapper (no counter-spin so it rotates with the ball) */
    .ball-number {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      user-select: none;
      pointer-events: none;
    }

    /* White circular badge */
    .number-badge {
      font-family: 'Trebuchet MS', 'Verdana', sans-serif;
       /* este es el tamaño del numero  */
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 0.005em;
      color: #1f2937;
      text-shadow: none;

      /* este es el tamaño del circulo branco que rodea el numero  */
      min-width: 3rem;
      height: 3rem;
      padding: 0 0.15rem;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.15);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 2px 5px rgba(0, 0, 0, 0.28),
        inset 0 -2px 4px rgba(0, 0, 0, 0.12);
      line-height: 1;
      text-decoration: underline;
    }

    .ball-gloss {
      position: absolute;
      top: 7%; left: 14%;
      width: 38%; height: 28%;
      border-radius: 50%;
      background: radial-gradient(ellipse at 38% 38%, rgba(255,255,255,0.80) 0%, rgba(255,255,255,0.00) 100%);
      transform: rotate(-30deg);
      z-index: 4;
      pointer-events: none;
    }

    .ball-shade {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 68% 72%, rgba(0,0,0,0.30) 0%, transparent 60%);
      z-index: 2;
      pointer-events: none;
    }

    .ball-border {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.55);
      z-index: 5;
      pointer-events: none;
    }

    /* Outer glow */
    .ball-glow {
      position: absolute;
      inset: -19px;
      border-radius: 50%;
      animation: glow-pulse 2s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: -1;
    }
    @keyframes glow-pulse {
      from { transform: scale(0.88); opacity: 0.55; }
      to   { transform: scale(1.10); opacity: 0.95; }
    }

    /* ══════════════════════════════════════
       ANIMATIONS
       ══════════════════════════════════════ */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes counter-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-360deg); }
    }
    @keyframes stop-settle {
      0%   { transform: rotate(0deg) scale(1); }
      72%  { transform: rotate(var(--stop-tilt-overshoot, -32deg)) scale(1.015); }
      100% { transform: rotate(var(--stop-tilt-final, -24deg)) scale(1); }
    }
    @keyframes trail-fade {
      0%   { opacity: 0.65; transform: scale(1); }
      100% { opacity: 0;    transform: scale(0.15); }
    }

    /* ══════════════════════════════════════
       FLOOR SHADOW
       ══════════════════════════════════════ */
    #ball-shadow {
      position: absolute;
      bottom: 10px;
      width: 84px;
      height: 19px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.44) 0%, rgba(0,0,0,0.22) 42%, transparent 76%);
      border-radius: 50%;
      opacity: 0;
      filter: blur(0.45px);
      transform-origin: center;
      transition: opacity 0.22s linear;
      pointer-events: none;
      will-change: transform, opacity, filter, left;
    }

    /* ══════════════════════════════════════
       NAME BANNER (opens toward the ball's travel direction)
       ══════════════════════════════════════ */
    #name-banner {
      position: absolute;
      /* JS sets bottom/left dynamically */
      height: 82px;
      width: 0;                          /* collapsed by default */
      overflow: hidden;
      transition: width 0.75s cubic-bezier(0.34, 1.42, 0.64, 1);
      pointer-events: none;
      z-index: 50;
    }

    /* The inner card – fixed size, gets revealed as width opens */
    .banner-card {
      width: 408px;
      height: 82px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0;
      /* Dark lottery-style panel */
      background: linear-gradient(105deg, #0d1b2a 0%, #1b2d42 55%, #0d1b2a 100%);
      border-top: 2px solid #ffd600;
      border-right: 2px solid #ffd600;
      border-bottom: 2px solid #ffd600;
      border-radius: 0 14px 14px 0;
      box-shadow:
        0 6px 24px rgba(0,0,0,0.60),
        0 0 20px rgba(255,214,0,0.18),
        inset 0 1px 0 rgba(255,255,255,0.06);
      overflow: hidden;
    }

    #name-banner.reverse .banner-card {
      flex-direction: row-reverse;
      border-right: 0;
      border-left: 2px solid #ffd600;
      border-radius: 14px 0 0 14px;
      background: linear-gradient(75deg, #0d1b2a 0%, #1b2d42 55%, #0d1b2a 100%);
    }

    #name-banner.reverse .banner-avatar {
      margin: 0 16px 0 12px;
    }

    /* Avatar circular */
    .banner-avatar {
      position: relative;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      margin: 0 12px 0 16px;
      border: 2.5px solid #ffd600;
      box-shadow:
        0 0 14px rgba(255,214,0,0.35),
        0 2px 8px rgba(0,0,0,0.4);
      background-color: #1b2d42;
    }
    .banner-avatar img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
    }
    /* Gold left accent stripe */
    .banner-accent {
      width: 6px;
      height: 100%;
      background: linear-gradient(180deg, #ffe066 0%, #ffd600 50%, #ffab00 100%);
      flex-shrink: 0;
    }

    /* Text block */
    .banner-text {
      padding: 0 22px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1px;
    }

    .banner-label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #ffd600;
      opacity: 0.85;
    }

    .banner-name {
      font-family: 'Bebas Neue', 'Montserrat', sans-serif;
      font-weight: 400;
      font-size: 2.1rem;
      letter-spacing: 0.06em;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
      white-space: nowrap;
      text-decoration: underline;
    }

    /* Stars sparkle that appear when banner opens */
    .sparkle {
      position: absolute;
      border-radius: 50%;
      background: #ffd600;
      pointer-events: none;
      animation: sparkle-pop 0.6s ease-out forwards;
    }
    @keyframes sparkle-pop {
      0%   { transform: scale(0); opacity: 1; }
      60%  { transform: scale(1.4); opacity: 0.9; }
      100% { transform: scale(0.2); opacity: 0; }
    }

    /* Countdown ring that fills around the ball while stopped */
    #countdown-ring {
      position: absolute;
      width: 116px;
      height: 116px;
      top: -10px;
      left: -10px;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 10;
    }
    #countdown-ring svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    #countdown-ring circle {
      fill: none;
      stroke: #ffd600;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 283;   /* 2π × 45 ≈ 283 */
      stroke-dashoffset: 283;
      transition: stroke-dashoffset linear;
      filter: drop-shadow(0 0 4px rgba(255,214,0,0.6));
    }
  </style>
</head>
<body>

  <div id="ticker-overlay" aria-hidden="true">
    <div class="ticker-shell">
      <div class="ticker-viewport">
        <div class="ticker-track" id="ticker-track"></div>
      </div>
    </div>
  </div>

  <aside id="ball-queue-status" aria-live="polite" aria-hidden="true">
    <div class="ball-queue-header"><span>Próximas bolillas</span><span id="ball-queue-count">0</span></div>
    <ol id="ball-queue-list"></ol>
  </aside>

  <div id="ball-shadow"></div>

  <!-- Name banner – starts collapsed, left edge anchored to ball stop point -->
  <div id="name-banner">
    <div class="banner-card">
      <div class="banner-accent"></div>
      <div class="banner-avatar" id="banner-avatar" style="display:none">
        <img id="banner-avatar-img" src="" alt="">
      </div>
      <div class="banner-text">
        <span class="banner-label">Numero selecionado por:</span>
        <span class="banner-name" id="banner-name">Matias Moreira</span>
      </div>
    </div>
  </div>

  <div id="ball-wrapper">
    <!-- Countdown ring (sits outside ball, counter-spins handled by JS) -->
    <div id="countdown-ring">
      <svg viewBox="0 0 96 96">
        <circle id="ring-circle" cx="48" cy="48" r="45"/>
      </svg>
    </div>

    <div class="ball-glow" id="ball-glow"></div>
    <div class="lottery-ball rolling" id="lottery-ball">
      <div class="ball-body" id="ball-body"></div>
      <div class="ball-shade"></div>
      <div class="ball-number">
        <span class="number-badge" id="ball-number">7</span>
      </div>
      <div class="ball-gloss"></div>
      <div class="ball-border"></div>
    </div>
  </div>

  <script>
    /* ══════════════════════════════════════════════════════════
       COLOR PALETTE  (stable by number: (n-1) % 9)
       ══════════════════════════════════════════════════════════ */
    const BALL_COLORS = [
      /* 0 yellow  */ { bg: 'radial-gradient(circle at 35% 30%, #fff9c4 0%, #ffd600 35%, #f9a825 65%, #e65100 100%)', glow: 'rgba(255,214,0,0.45)' },
      /* 1 blue    */ { bg: 'radial-gradient(circle at 35% 30%, #bbdefb 0%, #1e88e5 35%, #1565c0 65%, #0d47a1 100%)', glow: 'rgba(30,136,229,0.45)' },
      /* 2 green   */ { bg: 'radial-gradient(circle at 35% 30%, #c8e6c9 0%, #43a047 35%, #2e7d32 65%, #1b5e20 100%)', glow: 'rgba(67,160,71,0.45)' },
      /* 3 orange  */ { bg: 'radial-gradient(circle at 35% 30%, #ffe0b2 0%, #fb8c00 35%, #e65100 65%, #bf360c 100%)', glow: 'rgba(251,140,0,0.45)' },
      /* 4 red     */ { bg: 'radial-gradient(circle at 35% 30%, #ffcdd2 0%, #e53935 35%, #c62828 65%, #b71c1c 100%)', glow: 'rgba(229,57,53,0.45)' },
      /* 5 purple  */ { bg: 'radial-gradient(circle at 35% 30%, #e1bee7 0%, #8e24aa 35%, #6a1b9a 65%, #4a148c 100%)', glow: 'rgba(142,36,170,0.45)' },
      /* 6 cyan    */ { bg: 'radial-gradient(circle at 35% 30%, #b2ebf2 0%, #00acc1 35%, #00838f 65%, #006064 100%)', glow: 'rgba(0,172,193,0.45)' },
      /* 7 black   */ { bg: 'radial-gradient(circle at 35% 30%, #616161 0%, #424242 35%, #212121 65%, #000000 100%)', glow: 'rgba(100,100,100,0.40)' },
      /* 8 white   */ { bg: 'radial-gradient(circle at 35% 30%, #ffffff 0%, #eeeeee 40%, #bdbdbd 75%, #9e9e9e 100%)', glow: 'rgba(200,200,200,0.45)' },
    ];
    function colorForNumber(n) {
      return BALL_COLORS[((n - 1) % BALL_COLORS.length + BALL_COLORS.length) % BALL_COLORS.length];
    }

    /* ══════════════════════════════════════════════════════════
       CONFIG
       ══════════════════════════════════════════════════════════ */
    const CONFIG = {
      W: 720, H: 1280,
      BALL_SIZE: 96,
      START_Y:   -120,
      BOTTOM_Y:  1280 - 130,   // floor level (ball top)
      FALL_SPEED:  204,        // px/s
      SLIDE_SPEED: 288,        // px/s
      EXIT_SPEED:  384,        // px/s (exit after reveal)
      STOP_X:       19,        // where ball stops (left edge)
      REVEAL_X:    384,        // x at which banner starts opening
      STOP_MS:   10000,        // pause at bottom-left (ms)
      QUEUE_STOP_MS: 3500,     // shorter pause while another ball is waiting
      PAUSE_MS:    600,        // pause before restart
      TRAIL_MS:     90,
      NUMBERS: Array.from({length: 90}, (_, i) => i + 1),
      WINNER_NAME: 'Matias Moreira',
      NUMBER_FONT_REM: 1.5,
      BADGE_SIZE_REM: 3.0,
      LEFT_TILT_DEG: -24,
      RIGHT_TILT_DEG: 24,
      RANDOM_LINKED_SPEED: false,
      MODE: 'test',            // 'test' | 'manual' | 'dynamic'
      WEBSOCKET_URL: `ws://${window.location.hostname || 'localhost'}:688`,
      API_URL: '',
      TICKER_ENABLED: true,
      TICKER_LABEL: 'Radio',
      TICKER_TEXTS: [
        'Loteria Ball lista para OBS',
        'Ticker inferior izquierdo activo',
        'Se oculta cuando se lanza una bolilla'
      ],
      TICKER_SCROLL_MS: 28000
    };

    /* ══════════════════════════════════════════════════════════
       DOM REFS
       ══════════════════════════════════════════════════════════ */
    const wrapper    = document.getElementById('ball-wrapper');
    const shadow     = document.getElementById('ball-shadow');
    const bodyEl     = document.getElementById('ball-body');
    const numEl      = document.getElementById('ball-number');
    const glowEl     = document.getElementById('ball-glow');
    const banner     = document.getElementById('name-banner');
    const bannerName = document.getElementById('banner-name');
    const bannerAvatar = document.getElementById('banner-avatar');
    const bannerAvatarImg = document.getElementById('banner-avatar-img');
    const tickerOverlay = document.getElementById('ticker-overlay');
    const tickerTrack = document.getElementById('ticker-track');
    const ringEl     = document.getElementById('countdown-ring');
    const ringCircle = document.getElementById('ring-circle');
    const queueStatus = document.getElementById('ball-queue-status');
    const queueCount = document.getElementById('ball-queue-count');
    const queueList = document.getElementById('ball-queue-list');
    const queueTitle = queueStatus?.querySelector('.ball-queue-header span');

    let x = 0, y = 0;
    let phase = 'pausing';   // falling | sliding | stopped | exit | pausing
    let currentDirection = 'rightToLeft';
    const ballQueue = [];
    let currentBall = null;
    let currentQueueId = '';
    const PENDING_FINISH_STORAGE_KEY = 'lottery_ball_pending_finished_queue_ids';
    const pendingFinishedQueueIds = new Set();
    let queuePaused = false;
    let pendingQueueCount = 0;
    const offlineQueue = [];
    let overlayQueueReady = false;
    let queueAdvanceTimer = null;
    let stopStartedAt = 0;
    let activeStopDuration = 0;
    let lastTime  = null;
    let trailTimer = null;
    let stopTimer  = null;
    let bannerOpen = false;
    let initialSyncResolved = false;
    let initialSyncTimer = null;
    let lastTriggerSignature = '';
    let lastTriggerAt = 0;
    const recentTriggerIds = new Set();
    const TRIGGER_DEDUP_MS = 2000;

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalizeTickerTexts(texts) {
      const fallback = [
        'Loteria Ball lista para OBS',
        'Ticker inferior izquierdo activo',
        'Se oculta cuando se lanza una bolilla'
      ];
      const list = Array.isArray(texts) ? texts : [];
      const cleaned = list
        .map((item) => typeof item === 'string' ? item.trim() : '')
        .filter(Boolean);
      return cleaned.length ? cleaned : fallback;
    }

    function renderTicker() {
      if (!tickerTrack) return;
      const items = normalizeTickerTexts(CONFIG.TICKER_TEXTS);
      const scrollMs = Math.max(6000, parseInt(CONFIG.TICKER_SCROLL_MS, 10) || 20000);
      const groupHtml = items.map((text) => `
        <span class="ticker-item">
          <span class="ticker-text">${escapeHtml(text)}</span>
        </span>
      `).join('<span class="ticker-item"><span class="ticker-text">•</span></span>');

      tickerTrack.innerHTML = groupHtml ? `<div class="ticker-group">${groupHtml}</div><div class="ticker-group" aria-hidden="true">${groupHtml}</div>` : '';
      tickerTrack.style.animationDuration = `${scrollMs}ms`;
    }

    function syncTickerVisibility() {
      if (!tickerOverlay) return;
      const shouldShow = CONFIG.TICKER_ENABLED !== false && phase === 'pausing';
      tickerOverlay.classList.toggle('visible', shouldShow);
      tickerOverlay.setAttribute('aria-hidden', shouldShow ? 'false' : 'true');
    }

    function showTicker() {
      syncTickerVisibility();
    }

    function renderBallQueue() {
      if (!queueStatus || !queueCount || !queueList) return;
      const queuedCount = ballQueue.length;
      queueCount.textContent = String(queuedCount);
      if (queueTitle) queueTitle.textContent = queuePaused ? 'Cola en pausa' : 'Próximas bolillas';
      queueList.replaceChildren();
      ballQueue.slice(0, 4).forEach((item) => {
        const row = document.createElement('li');
        const number = document.createElement('span');
        number.textContent = `#${String(item.number).padStart(2, '0')}`;
        row.append(number, document.createTextNode(String(item.name || 'Alguien')));
        queueList.appendChild(row);
      });
      if (queuedCount > 4) {
        const more = document.createElement('li');
        more.textContent = `y ${queuedCount - 4} más`;
        queueList.appendChild(more);
      }
      queueStatus.classList.toggle('visible', queuedCount > 0);
      queueStatus.setAttribute('aria-hidden', queuedCount > 0 ? 'false' : 'true');
    }

    function restorePendingFinishedQueueIds() {
      try {
        const saved = JSON.parse(sessionStorage.getItem(PENDING_FINISH_STORAGE_KEY) || '[]');
        if (Array.isArray(saved)) {
          saved.filter(id => typeof id === 'string' && id.length <= 100).forEach(id => pendingFinishedQueueIds.add(id));
        }
      } catch (error) {
        console.warn('No se pudieron recuperar confirmaciones de bolillas:', error?.message || error);
      }
    }

    function persistPendingFinishedQueueIds() {
      try {
        const ids = Array.from(pendingFinishedQueueIds).slice(-100);
        if (ids.length) sessionStorage.setItem(PENDING_FINISH_STORAGE_KEY, JSON.stringify(ids));
        else sessionStorage.removeItem(PENDING_FINISH_STORAGE_KEY);
      } catch (error) {
        console.warn('No se pudieron guardar confirmaciones de bolillas:', error?.message || error);
      }
    }

    function sendOverlayQueueMessage(message) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return false;
      try {
        ws.send(JSON.stringify({ ...message, ...(CONFIG.WS_TOKEN ? { token: CONFIG.WS_TOKEN } : {}) }));
        return true;
      } catch (error) {
        console.error('No se pudo sincronizar la cola con el servidor:', error);
        return false;
      }
    }

    function makeQueueId() {
      return globalThis.crypto?.randomUUID?.() || `ball-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
    }

    function cleanQueueItem(item) {
      const number = Number(item?.number);
      if (!Number.isInteger(number) || number < 1 || number > 99) return null;
      return {
        queueId: String(item.queueId || makeQueueId()),
        eventId: String(item.eventId || ''),
        number,
        name: String(item.name || 'Alguien'),
        profilePicUrl: typeof item.profilePicUrl === 'string' ? item.profilePicUrl : '',
        lotteryName: String(item.lotteryName || ''),
        createdAt: Number(item.createdAt) || Date.now(),
        direction: item.direction === 'leftToRight' ? 'leftToRight' : 'rightToLeft',
        forceReplay: item.forceReplay === true,
        isTest: item.isTest === true
      };
    }

    function applyServerQueueState(data) {
      const pending = Array.isArray(data.pending) ? data.pending.map(cleanQueueItem).filter(Boolean) : [];
      const serverQueueIds = new Set([data.current, ...pending].map(item => String(item?.queueId || '')).filter(Boolean));
      for (const queueId of pendingFinishedQueueIds) {
        if (!serverQueueIds.has(queueId)) {
          pendingFinishedQueueIds.delete(queueId);
          if (currentQueueId === queueId && phase === 'pausing') currentQueueId = '';
        }
      }
      persistPendingFinishedQueueIds();

      const seen = new Set(pending.flatMap(item => [item.queueId, item.eventId].filter(Boolean)));
      const merged = [...pending];
      for (const item of offlineQueue) {
        if (!seen.has(item.queueId) && (!item.eventId || !seen.has(item.eventId))) merged.push(item);
      }
      merged.sort((a, b) => a.createdAt - b.createdAt);
      ballQueue.splice(0, ballQueue.length, ...merged);
      queuePaused = data.paused === true;
      pendingQueueCount = ballQueue.length;
      overlayQueueReady = true;
      renderBallQueue();
      shortenCurrentStopForQueue();
      if (data.current?.queueId && pendingFinishedQueueIds.has(String(data.current.queueId))) {
        sendOverlayQueueMessage({ type: 'BALL_FINISHED', queueId: String(data.current.queueId) });
      }
      if ((!ws || ws.readyState !== WebSocket.OPEN) && phase === 'pausing' && !currentQueueId && !queuePaused && ballQueue.length && !queueAdvanceTimer) {
        scheduleNextBall();
      }
    }

    function submitBallToServer(message) {
      const item = cleanQueueItem(message);
      if (!item) return false;
      item.eventId = item.eventId || `overlay-${item.queueId}`;
      if (sendOverlayQueueMessage({ type: 'TRIGGER_BALL', ...item, source: 'overlay' })) return true;
      return triggerBall(item.number, item.name, item.profilePicUrl, item.eventId, item.direction, item.forceReplay, item.queueId);
    }

    function hideTicker() {
      if (!tickerOverlay) return;
      tickerOverlay.classList.remove('visible');
      tickerOverlay.setAttribute('aria-hidden', 'true');
    }

    function shouldAcceptTrigger(number, name, eventId, forceReplay = false) {
      const now = Date.now();
      const signature = `${String(number)}::${String(name)}`;

      if (eventId) {
        if (recentTriggerIds.has(eventId)) {
          return false;
        }
        recentTriggerIds.add(eventId);
        setTimeout(() => recentTriggerIds.delete(eventId), 30000);
      }

      if (!forceReplay && signature === lastTriggerSignature && (now - lastTriggerAt) < TRIGGER_DEDUP_MS) {
        return false;
      }

      lastTriggerSignature = signature;
      lastTriggerAt = now;
      return true;
    }

    /* ══════════════════════════════════════════════════════════
       CONFIG LOADING
       ══════════════════════════════════════════════════════════ */
    function loadSavedConfig() {
      try {
        const saved = localStorage.getItem('lottery_ball_config');
        if (saved) {
          const parsed = JSON.parse(saved);
          Object.assign(CONFIG, parsed);
        }
      } catch(e) {
        console.error("Error loading config:", e);
      }
      renderTicker();
      syncTickerVisibility();
    }

    function normalizeOverlayWebSocketUrl() {
      const pageHost = String(window.location.hostname || '').toLowerCase();
      if (!pageHost || ['localhost', '127.0.0.1', '::1', '[::1]'].includes(pageHost)) return;
      try {
        const endpoint = new URL(CONFIG.WEBSOCKET_URL);
        if (['localhost', '127.0.0.1', '::1', '[::1]'].includes(endpoint.hostname.toLowerCase())) {
          endpoint.hostname = pageHost;
          CONFIG.WEBSOCKET_URL = endpoint.toString().replace(/\/$/, '');
        }
      } catch (error) {
        console.warn('No se pudo normalizar el servidor WebSocket del overlay:', error?.message || error);
      }
    }

    function applyDimensions() {
      document.documentElement.style.width = CONFIG.W + 'px';
      document.documentElement.style.height = CONFIG.H + 'px';
      document.body.style.width = CONFIG.W + 'px';
      document.body.style.height = CONFIG.H + 'px';
      CONFIG.BOTTOM_Y = CONFIG.H - 130;
      syncBannerPos();
    }

    /* ══════════════════════════════════════════════════════════
       POSITION HELPERS
       ══════════════════════════════════════════════════════════ */
    function setPos(px, py) {
      wrapper.style.left = px + 'px';
      wrapper.style.top  = py + 'px';
      x = px; y = py;
    }

    function parkBall() {
      const startX = CONFIG.W - CONFIG.BALL_SIZE - 30;
      setPos(startX, CONFIG.START_Y);
      shadow.style.opacity = '0';
      phase = 'pausing';
      stopTrail();
      hideCountdownRing();
      closeBanner();
      setSpinState('off');
      showTicker();
    }

    function resolveInitialSync() {
      if (initialSyncResolved) return;
      initialSyncResolved = true;
      if (initialSyncTimer) {
        clearTimeout(initialSyncTimer);
        initialSyncTimer = null;
      }
      if (CONFIG.MODE === 'test') {
        resetBall();
      } else {
        parkBall();
      }
    }

    function updateShadow(px, py, opacityBoost = 0) {
      const minScale = 0.58;
      const maxScale = 1.1;
      const fallRange = Math.max(1, CONFIG.BOTTOM_Y - CONFIG.START_Y);
      const floorProgress = Math.max(0, Math.min(1, (py - CONFIG.START_Y) / fallRange));
      const sx = minScale + (maxScale - minScale) * floorProgress;
      const sy = 0.72 + floorProgress * 0.34;
      const drift = Math.sin(performance.now() / 140) * (phase === 'stopped' ? 0.8 : 0.35);
      const alpha = Math.max(0, Math.min(0.78, floorProgress * 0.66 + opacityBoost));
      const blur = Math.max(0.2, (1 - floorProgress) * 1.25);

      shadow.style.left = (px + 6 + drift).toFixed(2) + 'px';
      shadow.style.opacity = alpha.toFixed(2);
      shadow.style.filter = `blur(${blur.toFixed(2)}px)`;
      shadow.style.transform = `scale(${sx.toFixed(3)}, ${sy.toFixed(3)})`;
    }

    function syncBannerPos() {
      const reverse = currentDirection === 'leftToRight';
      const rightStopX = CONFIG.W - CONFIG.BALL_SIZE - CONFIG.STOP_X;
      const bannerTop  = CONFIG.BOTTOM_Y + (CONFIG.BALL_SIZE / 2) - (82 / 2);
      banner.classList.toggle('reverse', reverse);
      if (reverse) {
        banner.style.left = 'auto';
        banner.style.right = (CONFIG.W - rightStopX) + 'px';
      } else {
        banner.style.right = 'auto';
        banner.style.left = (CONFIG.STOP_X + CONFIG.BALL_SIZE) + 'px';
      }
      banner.style.top  = bannerTop  + 'px';
    }

    /* ══════════════════════════════════════════════════════════
       COLORS
       ══════════════════════════════════════════════════════════ */
    function applyColor(n) {
      const c = colorForNumber(n);
      bodyEl.style.background = c.bg;
      glowEl.style.background = `radial-gradient(circle, ${c.glow} 0%, transparent 70%)`;
    }

    function applyNumberStyles() {
      const fontRem = Math.max(0.7, Math.min(2.4, parseFloat(CONFIG.NUMBER_FONT_REM) || 1.25));
      const badgeRem = Math.max(1.6, Math.min(4.2, parseFloat(CONFIG.BADGE_SIZE_REM) || 2.5));
      numEl.style.fontSize = fontRem.toFixed(2) + 'rem';
      numEl.style.minWidth = badgeRem.toFixed(2) + 'rem';
      numEl.style.height = badgeRem.toFixed(2) + 'rem';
    }

    function randomNumber() {
      const pool = CONFIG.NUMBERS;
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function setSpinState(mode) {
      const ball = document.getElementById('lottery-ball');
      if (!ball) return;
      ball.classList.remove('spin-fast', 'spin-slow', 'spin-stop');
      if (mode === 'fast') {
        ball.classList.add('rolling', 'spin-fast');
      } else if (mode === 'slow') {
        ball.classList.add('rolling', 'spin-slow');
      } else if (mode === 'stop') {
        const leftRaw = parseFloat(CONFIG.LEFT_TILT_DEG);
        const rightRaw = parseFloat(CONFIG.RIGHT_TILT_DEG);
        const leftLimit = Number.isFinite(leftRaw) ? leftRaw : -24;
        const rightLimit = Number.isFinite(rightRaw) ? rightRaw : 24;
        const minTilt = Math.min(leftLimit, rightLimit);
        const maxTilt = Math.max(leftLimit, rightLimit);
        const span = maxTilt - minTilt;
        const finalTilt = span > 0.001 ? (minTilt + Math.random() * span) : minTilt;
        const overshoot = finalTilt + (finalTilt >= 0 ? 9 : -9);
        ball.style.setProperty('--stop-tilt-final', `${finalTilt.toFixed(2)}deg`);
        ball.style.setProperty('--stop-tilt-overshoot', `${overshoot.toFixed(2)}deg`);
        ball.classList.remove('rolling');
        ball.classList.add('spin-stop');
      } else if (mode === 'off') {
        ball.classList.remove('rolling');
      }
    }

    function applyRandomLinkedSpeedIfNeeded() {
      if (!CONFIG.RANDOM_LINKED_SPEED) return;
      const min = Math.min(parseFloat(CONFIG.FALL_SPEED) || 170, parseFloat(CONFIG.SLIDE_SPEED) || 240);
      const max = Math.max(parseFloat(CONFIG.FALL_SPEED) || 170, parseFloat(CONFIG.SLIDE_SPEED) || 240);
      const randomSpeed = min + Math.random() * Math.max(0, max - min);
      const speed = Math.round(randomSpeed);
      CONFIG.FALL_SPEED = speed;
      CONFIG.SLIDE_SPEED = speed;
    }

    /* ══════════════════════════════════════════════════════════
       TRAIL PARTICLES
       ══════════════════════════════════════════════════════════ */
    function spawnTrail() {
      if (phase === 'pausing' || phase === 'stopped') return;
      const p    = document.createElement('div');
      const size = (5 + Math.random() * 9) | 0;
      p.style.cssText = `
        position:absolute; border-radius:50%; pointer-events:none;
        width:${size}px; height:${size}px;
        background: radial-gradient(circle, rgba(255,255,255,0.55), rgba(255,255,255,0.0));
        left:${x + CONFIG.BALL_SIZE/2 - size/2 + (Math.random()-0.5)*28}px;
        top:${y  + CONFIG.BALL_SIZE/2 - size/2 + (Math.random()-0.5)*18}px;
        animation: trail-fade 0.7s ease-out forwards;
        z-index:10;
      `;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 750);
    }
    function startTrail() { stopTrail(); trailTimer = setInterval(spawnTrail, CONFIG.TRAIL_MS); }
    function stopTrail()  { if (trailTimer) { clearInterval(trailTimer); trailTimer = null; } }

    /* ══════════════════════════════════════════════════════════
       BANNER OPEN / CLOSE
       ══════════════════════════════════════════════════════════ */
    function openBanner() {
      if (bannerOpen) return;
      bannerOpen = true;
      syncBannerPos();
      // Small delay so CSS transition kicks in
      requestAnimationFrame(() => {
        banner.style.width = '408px';
      });
      spawnSparkles();
    }

    function closeBanner() {
      bannerOpen = false;
      banner.style.width = '0';
    }

    function spawnSparkles() {
      const rightStopX = CONFIG.W - CONFIG.BALL_SIZE - CONFIG.STOP_X;
      const bannerLeft = currentDirection === 'leftToRight'
        ? rightStopX - 408
        : CONFIG.STOP_X + CONFIG.BALL_SIZE;
      const bTop  = CONFIG.BOTTOM_Y + (CONFIG.BALL_SIZE / 2) - (82 / 2);
      for (let i = 0; i < 10; i++) {
        setTimeout(() => {
          const s = document.createElement('div');
          s.className = 'sparkle';
          const sz = (4 + Math.random() * 8) | 0;
          s.style.cssText = `
            width:${sz}px; height:${sz}px;
            left:${bannerLeft + Math.random() * 200}px;
            top:${bTop  + (Math.random() - 0.5) * 60}px;
          `;
          document.body.appendChild(s);
          setTimeout(() => s.remove(), 650);
        }, i * 55);
      }
    }

    /* ══════════════════════════════════════════════════════════
       COUNTDOWN RING  (fills up over STOP_MS)
       ══════════════════════════════════════════════════════════ */
    function startCountdownRing(durationMs = CONFIG.STOP_MS, initialFraction = 1) {
      ringEl.style.opacity = '1';
      ringCircle.style.transition = 'none';
      ringCircle.style.strokeDashoffset = String(283 * Math.max(0, Math.min(1, initialFraction)));
      void ringCircle.getBoundingClientRect();
      ringCircle.style.transition = `stroke-dashoffset ${Math.max(1, durationMs)}ms linear`;
      ringCircle.style.strokeDashoffset = '0';
    }

    function beginBallExit() {
      if (phase !== 'stopped') return;
      stopTimer = null;
      phase = 'exit';
      setSpinState('fast');
      startTrail();
    }

    function shortenCurrentStopForQueue() {
      if (phase !== 'stopped' || !stopStartedAt) return;
      const standardStopMs = Math.max(1000, Number(CONFIG.STOP_MS) || 10000);
      const queueStopMs = Math.max(1000, Number(CONFIG.QUEUE_STOP_MS) || 3500);
      const targetDuration = pendingQueueCount > 0 && !queuePaused
        ? Math.min(standardStopMs, queueStopMs)
        : standardStopMs;
      if (targetDuration === activeStopDuration) return;
      activeStopDuration = targetDuration;
      const elapsedMs = Date.now() - stopStartedAt;
      const remainingMs = targetDuration - elapsedMs;
      if (stopTimer) clearTimeout(stopTimer);
      if (remainingMs <= 0) {
        beginBallExit();
        return;
      }
      startCountdownRing(remainingMs, remainingMs / targetDuration);
      stopTimer = setTimeout(beginBallExit, remainingMs);
    }
    function hideCountdownRing() {
      ringCircle.style.transition = 'none';
      ringCircle.style.strokeDashoffset = '283';
      ringEl.style.opacity = '0';
    }

    /* ══════════════════════════════════════════════════════════
       ANIMATION LOOP
       ══════════════════════════════════════════════════════════ */
    function tick(ts) {
      if (!lastTime) lastTime = ts;
      const dt = Math.min((ts - lastTime) / 1000, 0.08);
      lastTime = ts;

      /* ── FALLING ── */
      if (phase === 'falling') {
        const ny = y + CONFIG.FALL_SPEED * dt;
        updateShadow(x, ny);

        if (ny >= CONFIG.BOTTOM_Y) {
          setPos(x, CONFIG.BOTTOM_Y);
          updateShadow(x, CONFIG.BOTTOM_Y, 0.04);
          setSpinState('slow');
          phase = 'sliding';
        } else {
          setPos(x, ny);
        }
      }

      /* ── SLIDE TOWARD THE STOP SIDE ── */
      else if (phase === 'sliding') {
        const movingRight = currentDirection === 'leftToRight';
        const rightStopX = CONFIG.W - CONFIG.BALL_SIZE - CONFIG.STOP_X;
        const stopX = movingRight ? rightStopX : CONFIG.STOP_X;
        const revealX = movingRight ? CONFIG.W - CONFIG.REVEAL_X - CONFIG.BALL_SIZE : CONFIG.REVEAL_X;
        const nx = x + (movingRight ? 1 : -1) * CONFIG.SLIDE_SPEED * dt;
        updateShadow(nx, y, 0.05);

        if (!bannerOpen && (movingRight ? nx >= revealX : nx <= revealX)) {
          openBanner();
        }

        if (movingRight ? nx >= stopX : nx <= stopX) {
          setPos(stopX, y);
          updateShadow(stopX, y, 0.12);
          phase = 'stopped';
          stopTrail();
          stopStartedAt = Date.now();
          const standardStopMs = Math.max(1000, Number(CONFIG.STOP_MS) || 10000);
          const queueStopMs = Math.max(1000, Number(CONFIG.QUEUE_STOP_MS) || 3500);
          activeStopDuration = pendingQueueCount > 0 && !queuePaused
            ? Math.min(standardStopMs, queueStopMs)
            : standardStopMs;
          startCountdownRing(activeStopDuration);
          setSpinState('stop');
          stopTimer = setTimeout(beginBallExit, activeStopDuration);
        } else {
          setPos(nx, y);
        }
      }

      /* ── EXIT THROUGH THE STOP SIDE ── */
      else if (phase === 'exit') {
        const movingRight = currentDirection === 'leftToRight';
        const nx = x + (movingRight ? 1 : -1) * CONFIG.EXIT_SPEED * dt;
        const exitBoost = Math.max(-0.4, 0.08 - (1.35 * dt));
        updateShadow(nx, y, exitBoost);

        if (movingRight ? nx >= CONFIG.W : nx + CONFIG.BALL_SIZE <= 0) {
          // Ball gone — close banner & reset
          closeBanner();
          hideCountdownRing();
          stopTrail();
          phase = 'pausing';
          shadow.style.opacity = '0';
          showTicker();
          finishBallAndWait();
        } else {
          setPos(nx, y);
        }
      }

      requestAnimationFrame(tick);
    }

    /* ══════════════════════════════════════════════════════════
       TRIGGER DYNAMIC OR MANUAL BALL
       ══════════════════════════════════════════════════════════ */
    function setBannerAvatar(profilePicUrl) {
      const safeUrl = typeof profilePicUrl === 'string' ? profilePicUrl.trim() : '';
      if (!safeUrl) {
        bannerAvatar.style.display = 'none';
        return;
      }
      const hasQuery = safeUrl.includes('?');
      bannerAvatarImg.src = `${safeUrl}${hasQuery ? '&' : '?'}cb=${Date.now()}`;
      bannerAvatar.style.display = 'block';
    }

    function startBall(item, { serverQueue = false, isTest = false } = {}) {
      currentBall = cleanQueueItem(item) || item;
      currentQueueId = serverQueue ? String(currentBall.queueId || '') : '';
      currentDirection = item.direction === 'leftToRight' ? 'leftToRight' : 'rightToLeft';
      if (stopTimer) { clearTimeout(stopTimer); stopTimer = null; }
      if (queueAdvanceTimer) { clearTimeout(queueAdvanceTimer); queueAdvanceTimer = null; }
      closeBanner();
      hideCountdownRing();
      hideTicker();
      stopTrail();
      applyRandomLinkedSpeedIfNeeded();

      numEl.textContent = item.number;
      bannerName.textContent = item.name;
      setBannerAvatar(item.profilePicUrl);
      applyColor(item.number);

      setSpinState('fast');

      const startX = currentDirection === 'leftToRight'
        ? 20 + (Math.random() * 30 | 0)
        : CONFIG.W - CONFIG.BALL_SIZE - (20 + (Math.random() * 30 | 0));
      setPos(startX, CONFIG.START_Y);
      shadow.style.left    = (startX + 10) + 'px';
      shadow.style.opacity = '0';
      shadow.style.transform = 'scale(0.55,0.55)';
      bannerOpen = false;
      phase = 'falling';
      startTrail();
      renderBallQueue();
      if (!serverQueue) sendOverlayQueueMessage({ type: 'OVERLAY_BUSY', isTest: isTest === true });
    }

    function scheduleNextBall() {
      if (queueAdvanceTimer) {
        clearTimeout(queueAdvanceTimer);
        queueAdvanceTimer = null;
      }
      if (queuePaused && ballQueue.length) {
        renderBallQueue();
        return;
      }
      if (!ballQueue.length && CONFIG.MODE !== 'test') {
        renderBallQueue();
        return;
      }
      const pauseMs = Math.max(0, parseInt(CONFIG.PAUSE_MS, 10) || 0);
      queueAdvanceTimer = setTimeout(() => {
        queueAdvanceTimer = null;
        if (ws && ws.readyState === WebSocket.OPEN && overlayQueueReady) {
          sendOverlayQueueMessage({ type: 'OVERLAY_IDLE' });
          return;
        }
        if (ballQueue.length) {
          const next = ballQueue.shift();
          const offlineIndex = offlineQueue.findIndex(item => item.queueId === next.queueId);
          if (offlineIndex >= 0) offlineQueue.splice(offlineIndex, 1);
          pendingQueueCount = ballQueue.length;
          startBall(next);
          return;
        }
        if (CONFIG.MODE === 'test') resetBall();
        else renderBallQueue();
      }, pauseMs);
    }

    function finishBallAndWait() {
      if (queueAdvanceTimer) clearTimeout(queueAdvanceTimer);
      const finishedQueueId = currentQueueId;
      currentBall = null;
      if (finishedQueueId) {
        pendingFinishedQueueIds.add(finishedQueueId);
        persistPendingFinishedQueueIds();
      }
      queueAdvanceTimer = setTimeout(() => {
        queueAdvanceTimer = null;
        if (finishedQueueId) {
          sendOverlayQueueMessage({ type: 'BALL_FINISHED', queueId: finishedQueueId });
          sendOverlayQueueMessage({ type: 'REQUEST_BALL_QUEUE_STATE' });
          return;
        }
        if (sendOverlayQueueMessage({ type: 'OVERLAY_IDLE', isTest: CONFIG.MODE === 'test' })) return;
        scheduleNextBall();
      }, Math.max(0, parseInt(CONFIG.PAUSE_MS, 10) || 0));
    }

    function triggerBall(number, name, profilePicUrl, eventId = '', direction = 'rightToLeft', forceReplay = false, queueId = '') {
      if (!shouldAcceptTrigger(number, name, eventId, forceReplay)) {
        return false;
      }
      const item = {
        queueId: queueId || makeQueueId(),
        eventId,
        number,
        name: String(name || 'Alguien'),
        profilePicUrl: profilePicUrl || '',
        direction: direction === 'leftToRight' ? 'leftToRight' : 'rightToLeft',
        forceReplay,
        createdAt: Date.now()
      };
      if (phase !== 'pausing' || queueAdvanceTimer || queuePaused) {
        ballQueue.push(item);
        offlineQueue.push(item);
        pendingQueueCount = ballQueue.length;
        renderBallQueue();
        shortenCurrentStopForQueue();
        return true;
      }
      startBall(item);
      return true;
    }

    function startQueuedBall(data) {
      const item = cleanQueueItem(data);
      if (!item) return;
      if (pendingFinishedQueueIds.has(item.queueId)) {
        sendOverlayQueueMessage({ type: 'BALL_FINISHED', queueId: item.queueId });
        return;
      }
      if (currentQueueId && currentQueueId === item.queueId) {
        if (phase === 'pausing') sendOverlayQueueMessage({ type: 'BALL_FINISHED', queueId: item.queueId });
        return;
      }
      const localIndex = ballQueue.findIndex(pending => pending.queueId === item.queueId);
      if (phase !== 'pausing' && currentQueueId !== item.queueId) {
        if (localIndex < 0) ballQueue.push(item);
        pendingQueueCount = ballQueue.length;
        renderBallQueue();
        sendOverlayQueueMessage({ type: 'OVERLAY_BUSY' });
        return;
      }
      if (localIndex >= 0) ballQueue.splice(localIndex, 1);
      const offlineIndex = offlineQueue.findIndex(pending => pending.queueId === item.queueId);
      if (offlineIndex >= 0) offlineQueue.splice(offlineIndex, 1);
      pendingQueueCount = ballQueue.length;
      if (item.eventId && recentTriggerIds.has(item.eventId)) {
        if (phase === 'pausing') sendOverlayQueueMessage({ type: 'BALL_FINISHED', queueId: item.queueId });
        return;
      }
      if (!shouldAcceptTrigger(item.number, item.name, item.eventId, true)) {
        sendOverlayQueueMessage({ type: 'BALL_FINISHED', queueId: item.queueId });
        return;
      }
      startBall(item, { serverQueue: true });
    }

    function resetBall() {
      if (phase !== 'pausing' || queueAdvanceTimer || (ballQueue.length && !queuePaused)) return;
      const n = randomNumber();
      startBall({
        queueId: `test-${makeQueueId()}`,
        eventId: `test-${makeQueueId()}`,
        number: n,
        name: CONFIG.WINNER_NAME,
        profilePicUrl: '',
        direction: 'rightToLeft',
        createdAt: Date.now(),
        isTest: true
      }, { isTest: true });
    }

    /* ══════════════════════════════════════════════════════════
       WEBSOCKET & API INTEGRATIONS (DYNAMIC MODE)
       ══════════════════════════════════════════════════════════ */
    let ws = null;
    let wsReconnectTimer = null;
    function connectWebSocket() {
      if (wsReconnectTimer) {
        clearTimeout(wsReconnectTimer);
        wsReconnectTimer = null;
      }
      if (ws) {
        try { ws.onclose = null; ws.close(); } catch(e){}
        ws = null;
      }
      if (!CONFIG.WEBSOCKET_URL) return;
      try {
        ws = new WebSocket(CONFIG.WEBSOCKET_URL);
        const activeSocket = ws;
        activeSocket.onopen = () => {
          if (ws !== activeSocket) return;
          console.log("Widget WebSocket conectado a", CONFIG.WEBSOCKET_URL);
          try {
            const pendingToRelay = offlineQueue.slice();
            activeSocket.send(JSON.stringify({
              type: 'WIDGET_HELLO',
              source: 'widget',
              requestConfig: true,
              busy: CONFIG.MODE === 'test' || phase !== 'pausing' || Boolean(queueAdvanceTimer) || pendingFinishedQueueIds.size > 0,
              ...(CONFIG.WS_TOKEN ? { token: CONFIG.WS_TOKEN } : {})
            }));
            for (const queueId of pendingFinishedQueueIds) {
              activeSocket.send(JSON.stringify({ type: 'BALL_FINISHED', queueId, ...(CONFIG.WS_TOKEN ? { token: CONFIG.WS_TOKEN } : {}) }));
            }
            for (const item of pendingToRelay) {
              activeSocket.send(JSON.stringify({ type: 'TRIGGER_BALL', ...item, source: 'overlay', ...(CONFIG.WS_TOKEN ? { token: CONFIG.WS_TOKEN } : {}) }));
            }
            activeSocket.send(JSON.stringify({ type: 'REQUEST_BALL_QUEUE_STATE', ...(CONFIG.WS_TOKEN ? { token: CONFIG.WS_TOKEN } : {}) }));
          } catch (e) {}
        };
        activeSocket.onmessage = (event) => {
          if (ws !== activeSocket) return;
          try {
            const data = JSON.parse(event.data);
            if (data?.type === 'TRIGGER_QUEUED') {
              const offlineIndex = offlineQueue.findIndex(item => item.queueId === data.queueId);
              if (offlineIndex >= 0) offlineQueue.splice(offlineIndex, 1);
              return;
            }
            if (data?.type === 'TRIGGER_QUEUE_ERROR') {
              const offlineIndex = offlineQueue.findIndex(item => item.eventId === data.eventId);
              if (offlineIndex >= 0) {
                const [failed] = offlineQueue.splice(offlineIndex, 1);
                const pendingIndex = ballQueue.findIndex(item => item.queueId === failed.queueId);
                if (pendingIndex >= 0) ballQueue.splice(pendingIndex, 1);
                pendingQueueCount = ballQueue.length;
                renderBallQueue();
              }
              console.warn(data.error || 'No se pudo agregar una bolilla a la cola.');
              return;
            }
            if (data?.type === 'OVERLAY_AUTH_ERROR') {
              console.error(data.error || 'El overlay todavía no está autorizado por el servidor.');
              return;
            }
            if (data?.type === 'BALL_QUEUE_STATE') {
              applyServerQueueState(data);
              return;
            }
            if (data?.type === 'START_QUEUED_BALL') {
              startQueuedBall(data);
              return;
            }
            if (data?.type === 'BALL_QUEUE_IDLE') {
              if (CONFIG.MODE === 'test' && phase === 'pausing' && !currentQueueId && !queueAdvanceTimer) resetBall();
              return;
            }
            if (data?.type === 'CONFIG_SNAPSHOT' && data?.config) {
              handleIncomingMessage({ type: 'UPDATE_CONFIG', config: data.config });
              return;
            }
            if (data?.type === 'CHANGE_MODE') {
              handleIncomingMessage({ type: 'CHANGE_MODE', mode: data.mode });
              return;
            }
            if (data?.type === 'UPDATE_CONFIG' && data?.config) {
              handleIncomingMessage({ type: 'UPDATE_CONFIG', config: data.config });
              return;
            }
            if (data?.type === 'TRIGGER_BALL' && data.number && data.name) submitBallToServer(data);
          } catch(e){}
        };
        activeSocket.onclose = (event) => {
          if (ws !== activeSocket) return;
          ws = null;
          overlayQueueReady = false;
          console.warn(`Widget WebSocket desconectado (código ${event.code}${event.reason ? `: ${event.reason}` : ''}). Reconectando…`);
          if (!wsReconnectTimer) {
            wsReconnectTimer = setTimeout(() => {
              wsReconnectTimer = null;
              if (!ws) connectWebSocket();
            }, 5000);
          }
        };
        activeSocket.onerror = (e) => {
          console.error("Widget WebSocket error:", e);
        };
      } catch(e){
        console.error("Error al configurar WebSocket del Widget:", e);
      }
    }

    let pollInterval = null;
    let lastFetchedTime = 0;
    
    function startPolling() {
      stopPolling();
      if (CONFIG.MODE !== 'dynamic' || !CONFIG.API_URL) return;
      
      pollInterval = setInterval(async () => {
        // Solo dispara si está pausado para evitar colisiones
        if (phase !== 'pausing') return;
        
        try {
          const res = await fetch(CONFIG.API_URL);
          if (!res.ok) return;
          const data = await res.json();
          if (data && data.number && data.name) {
            const signature = data.id || data.timestamp || `${data.number}_${data.name}`;
            if (signature !== lastFetchedTime) {
              lastFetchedTime = signature;
              submitBallToServer({
                number: data.number,
                name: data.name,
                profilePicUrl: data.profilePicUrl || '',
                eventId: String(signature),
                direction: 'rightToLeft'
              });
            }
          }
        } catch(e) {
          console.error("Error al consultar API:", e);
        }
      }, 3000);
    }
    
    function stopPolling() {
      if (pollInterval) {
        clearInterval(pollInterval);
        pollInterval = null;
      }
    }

    /* ══════════════════════════════════════════════════════════
       MESSAGING RECEIVER (BroadcastChannel & LocalStorage fallback)
       ══════════════════════════════════════════════════════════ */
    function handleIncomingMessage(msg) {
      if (!msg) return;
      
      if (msg.type === 'TRIGGER_BALL') {
        resolveInitialSync();
        submitBallToServer(msg);
      } else if (msg.type === 'CHANGE_MODE') {
        const oldMode = CONFIG.MODE;
        CONFIG.MODE = msg.mode;
        resolveInitialSync();
        if (CONFIG.MODE === 'test' && phase === 'pausing') {
          resetBall();
        }
        if (CONFIG.MODE !== oldMode) {
          startPolling();
        }
      } else if (msg.type === 'UPDATE_CONFIG') {
        const incoming = { ...msg.config };
        // Apply the same endpoint protection to WS, BroadcastChannel and storage.
        // A dashboard's localhost is not the OBS computer's localhost.
        if (Object.prototype.hasOwnProperty.call(incoming, 'WEBSOCKET_URL')) {
          const pageHost = String(window.location.hostname || '').toLowerCase();
          const loopbackHosts = ['localhost', '127.0.0.1', '::1', '[::1]'];
          try {
            const endpoint = new URL(incoming.WEBSOCKET_URL);
            if (!['ws:', 'wss:'].includes(endpoint.protocol) ||
                (!loopbackHosts.includes(pageHost) && loopbackHosts.includes(endpoint.hostname.toLowerCase()))) {
              delete incoming.WEBSOCKET_URL;
            }
          } catch (error) {
            delete incoming.WEBSOCKET_URL;
          }
        }
        const changed = Object.keys(incoming).some(key => JSON.stringify(CONFIG[key]) !== JSON.stringify(incoming[key]));
        if (!changed) {
          resolveInitialSync();
          return;
        }
        const oldWs = CONFIG.WEBSOCKET_URL;
        const oldApi = CONFIG.API_URL;
        const oldMode = CONFIG.MODE;
        
        Object.assign(CONFIG, incoming);
        applyDimensions();
        applyNumberStyles();
        renderTicker();
        syncTickerVisibility();
        shortenCurrentStopForQueue();
        resolveInitialSync();
        
        if (CONFIG.MODE === 'test' && phase === 'pausing') {
          resetBall();
        }
        if (CONFIG.WEBSOCKET_URL !== oldWs) {
          connectWebSocket();
        }
        if (CONFIG.API_URL !== oldApi || CONFIG.MODE !== oldMode) {
          startPolling();
        }
      }
    }

    /* ══════════════════════════════════════════════════════════
       INIT
       ══════════════════════════════════════════════════════════ */
    (function init() {
      loadSavedConfig();
      restorePendingFinishedQueueIds();
      normalizeOverlayWebSocketUrl();
      applyDimensions();
      applyNumberStyles();
      renderTicker();

      // Conectar canal BroadcastChannel
      try {
        const channel = new BroadcastChannel('lottery_ball_channel');
        channel.onmessage = (event) => {
          handleIncomingMessage(event.data);
        };
      } catch(e) {
        console.error("BroadcastChannel no soportado:", e);
      }

      // Escuchar eventos storage (fallback para OBS Browser Source)
      window.addEventListener('storage', (event) => {
        if (event.key === 'lottery_ball_msg' && event.newValue) {
          try {
            const data = JSON.parse(event.newValue);
            if (data && data.msg) {
              handleIncomingMessage(data.msg);
            }
          } catch(e) {}
        }
      });

      // Levantar WebSocket y Polling si se guardaron en modo dinámico
      connectWebSocket();
      startPolling();
      parkBall();
      initialSyncTimer = setTimeout(() => {
        resolveInitialSync();
      }, CONFIG.WEBSOCKET_URL ? 2500 : 100);

      syncTickerVisibility();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
